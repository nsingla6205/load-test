# =============================================================================
# OCI Block Volume Performance — VPU 30 only
# =============================================================================
#
# Source: OCI perf-team reference table.
#
# Layout
# ------
#   throughput:                       Keyed by customer-visible headroom
#     <headroom MB/s integer>:        throughput in decimal MB/s. Selector:
#                                         bucket = ceil(req.throughput_mbps / 800) * 800
#                                         tier   = throughput[bucket]
#                                     for O(1) flex lookup.
#                                     Keys advance in 800 MB/s steps:
#                                     800, 1600, 2400, 3200, 4000, 4800.
#
#       instances:                    Map of qualified OCI VM shapes that
#                                     deliver this throughput tier. The map
#                                     key is the OCI shape name (passed
#                                     verbatim to LaunchInstance.shape).
#                                     Today only one shape is qualified;
#                                     future shapes (E4.Flex, bare metal,
#                                     etc.) are added as siblings.
#         <shape>:
#           ocpus:                    OCPUs for this shape at this tier.
#                                     Passed to
#                                     LaunchInstance.shapeConfig.ocpus.
#           memory_gbs:               Memory (decimal GB) for this shape
#                                     at this tier. Passed to
#                                     LaunchInstance.shapeConfig.memoryInGBs.
#                                     Stay within OCI's per-shape flex
#                                     memory range (E5.Flex: 1–16 GB per
#                                     OCPU). Carried per (tier, shape)
#                                     rather than as a per-OCPU multiplier
#                                     so the perf team can deviate from a
#                                     flat ratio without code changes.
#           vpu:                      Per-volume pool policy table for
#                                     this specific shape (different shapes
#                                     can have different per-volume caps).
#             vpu_<NN>:
#               default_iops:            Pool-level IOPS included by default
#                                        when the customer omits IOPS on
#                                        create/update (vpu_30 only today).
#               max_iops:                Maximum pool-level IOPS the customer
#                                        may request for this tier.
#               min_capacity_tib:        Minimum pool capacity per node
#                                        (binary TiB) needed to deliver this
#                                        tier. NOT per-disk, NOT per-HA-pair.
#                                        The pool-create workflow slices the
#                                        customer's total capacity by
#                                        totalActiveVMs (AA: 2*HAPairs,
#                                        AP: HAPairs) before comparing
#                                        against this floor.
#
#     throughput_with_headroom:    OCI max-egress throughput (MB/s) sent to
#                                      VLM on SPConfig.Throughput (e.g. 1000
#                                      when the headroom tier key is 800).
#                                      The tier key itself is the customer-
#                                      effective Node QoS BW after OCI's 20%
#                                      headroom — no separate headroom field
#                                      is needed.
#
# Sizing reference (instance-level caps; same numbers for every shape today):
#
#   SKU / OCPU | Max egress | Node QoS BW (20% HR) | Default IOPS | Max IOPS | Min cap @ VPU30
#   8 OCPU     | 1000 MB/s  |  800 MB/s            |  12,500      | 128K     | 1.26 TiB
#  16 OCPU     | 2000 MB/s  | 1600 MB/s            |  25,000      | 256K     | 2.53 TiB
#  24 OCPU     | 3000 MB/s  | 2400 MB/s            |  37,500      | 260K     | 3.79 TiB
#  32 OCPU     | 4000 MB/s  | 3200 MB/s            |  50,000      | 260K     | 5.00 TiB
#  40 OCPU     | 5000 MB/s  | 4000 MB/s            |  62,500      | 260K     | 6.32 TiB
#  48 OCPU     | 6000 MB/s  | 4800 MB/s            |  75,000      | 260K     | 7.58 TiB
#
# VPU 30 per-volume density: 720 KB/s per GB, 90 IOPS per GB, max 75K IOPS per disk.
#
# Assumptions
# -----------
# 1) Throughput tiers advance in **800 MB/s steps** matching OCI's headroom
#    values. The selector uses `bucket = ceil(req.throughput_mbps / 800) * 800`
#    as the YAML key. If new tiers are added at a different step size, both
#    this file and the selector's bucketing logic must be updated together —
#    don't introduce a key outside the 800-MB/s ladder alone.
# 2) All shapes under one tier deliver the same headline throughput; the
#    tier's instance-level cap is implicit in the tier key itself.
#
# Each instance below carries a single vpu_30 cell. The selector walks the
# vpu map in ascending VPU number and returns the first whose
# `min_capacity_tib` floor fits the request.
#
# Capacities are in binary TiB (2^40 bytes), matching the OCI perf-team table
# verbatim. Throughput values remain decimal MB/s (10^6 bytes/s).
# =============================================================================

throughput:

  # ---------------------------------------------------------------------------
  # 800 MB/s headroom →  8 OCPU  (max-egress 1000 MB/s)
  # ---------------------------------------------------------------------------
  800:
    throughput_with_headroom: 1000
    instances:
      VM.DenseIO.E5.Flex:
        ocpus: 8
        memory_gbs: 96
        vpu:
          vpu_30:
            default_iops: 12500
            max_iops: 128000
            min_capacity_tib: 1.26

  # ---------------------------------------------------------------------------
  # 1600 MB/s headroom → 16 OCPU  (max-egress 2000 MB/s)
  # ---------------------------------------------------------------------------
  1600:
    throughput_with_headroom: 2000
    instances:
      VM.DenseIO.E5.Flex:
        ocpus: 16
        memory_gbs: 192
        vpu:
          vpu_30:
            default_iops: 25000
            max_iops: 256000
            min_capacity_tib: 2.53

  # ---------------------------------------------------------------------------
  # 2400 MB/s headroom → 24 OCPU  (max-egress 3000 MB/s)
  # ---------------------------------------------------------------------------
  2400:
    throughput_with_headroom: 3000
    instances:
      VM.DenseIO.E5.Flex:
        ocpus: 24
        memory_gbs: 288
        vpu:
          vpu_30:
            default_iops: 37500
            max_iops: 260000
            min_capacity_tib: 3.79

  # ---------------------------------------------------------------------------
  # 3200 MB/s headroom → 32 OCPU  (max-egress 4000 MB/s)
  # ---------------------------------------------------------------------------
  3200:
    throughput_with_headroom: 4000
    instances:
      VM.DenseIO.E5.Flex:
        ocpus: 32
        memory_gbs: 384
        vpu:
          vpu_30:
            default_iops: 50000
            max_iops: 260000
            min_capacity_tib: 5

  # ---------------------------------------------------------------------------
  # 4000 MB/s headroom → 40 OCPU  (max-egress 5000 MB/s)
  # ---------------------------------------------------------------------------
  4000:
    throughput_with_headroom: 5000
    instances:
      VM.DenseIO.E5.Flex:
        ocpus: 40
        memory_gbs: 480
        vpu:
          vpu_30:
            default_iops: 62500
            max_iops: 260000
            min_capacity_tib: 6.32

  # ---------------------------------------------------------------------------
  # 4800 MB/s headroom → 48 OCPU  (max-egress 6000 MB/s)
  # ---------------------------------------------------------------------------
  4800:
    throughput_with_headroom: 6000
    instances:
      VM.DenseIO.E5.Flex:
        ocpus: 48
        memory_gbs: 576
        vpu:
          vpu_30:
            default_iops: 75000
            max_iops: 260000
            min_capacity_tib: 7.58
