apiVersion: batch/v1
kind: Job
metadata:
  name: cluster-api-poc # from-param: ${job_name}
  namespace: vcp
  labels:
    app.kubernetes.io/name: cluster-api-poc
    app.kubernetes.io/component: connectivity-check
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-api-poc
    spec:
      serviceAccountName: cluster-api-poc
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: cluster-api-poc-image
          command: ["/bin/sh", "/opt/cluster-api/check.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /opt/cluster-api
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: cluster-api-poc
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
