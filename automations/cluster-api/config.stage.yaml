# Rollout + producer catalog for staging.
# Select a producer with --environment stage --project <sde-project-id>.
#
# project_number and cluster are filled from gcloud where this account has access.
# Empty cluster: GH discovers the producer GKE cluster. Empty number: GH uses
# `gcloud projects describe`. JWT still needs a number (config or VCP_PROJECT_NUMBER).

environment: stage
audience: https://cloudvolumesgcp-api.netapp.com

# Laptop: kubectl port-forward to core_api.base_url.
# In-cluster (GH / a pod): core_api.cluster_endpoint.
core_api:
  base_url: http://localhost:8080
  cluster_endpoint: http://core-service.vcp.svc.cluster.local:8080

# Reviewed image catalog. --ontap-version picks an entry, so adding a release is
# a config change instead of image paths typed at dispatch time.
image_versions:
  "9.18.1":
    vsa_image_path: GCNV/9.18.1/upgrade/cot.image.ONTAP-9.18.1.tgz
    vsa_name: x-9-18-1
    mediator_name: cvo-mediator-x-9-18-1
    is_active: true

# Target used when --ontap-version is omitted.
target_image:
  ontap_version: "9.18.1"
  vsa_image_path: GCNV/9.18.1/upgrade/cot.image.ONTAP-9.18.1.tgz
  vsa_name: x-9-18-1
  mediator_name: cvo-mediator-x-9-18-1
  is_active: true

# Informational — list-images and verify compare this with GET /v1/imageVersions
deployment:
  vsa_image_name: x-9-18-1
  ontap_version_details: "9.18.1"

batch:
  max_concurrency: 5
  failure_threshold: 1   # SRE default. API default is 0 (no abort).
  # Blast-radius ceiling for percentage selection. 0 leaves it to --max-clusters;
  # a non-zero value caps every wave regardless of what was dispatched.
  max_clusters_cap: 0

# Poll budget for upgrade operations. Dispatch cannot extend it.
poll:
  timeout_minutes: 720
  interval_seconds: 120

# require_change_ticket blocks write operations dispatched without a change record.
governance:
  require_change_ticket: false

# Optional: VCP Postgres for discover (psql). Password via PGPASSWORD.
# database:
#   host: 127.0.0.1
#   port: 5432
#   name: vcp
#   user: vcp

# Explicit pool UUIDs for poolList batch mode
pool_ids: []

