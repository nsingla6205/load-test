# Rollout + producer catalog for production.
# Select a producer with --environment prod --project <sde-project-id>.
#
# project_number and cluster are filled from gcloud where this account has access.
# Empty cluster: GH discovers the producer GKE cluster. Empty number: GH uses
# `gcloud projects describe`. JWT still needs a number (config or VCP_PROJECT_NUMBER).

environment: prod
audience: https://cloudvolumesgcp-api.netapp.com

# Laptop: kubectl port-forward to core_api.base_url.
# In-cluster (GH / a pod): core_api.cluster_endpoint.
core_api:
  base_url: http://localhost:8080
  cluster_endpoint: http://core-service.vcp.svc.cluster.local:8080

target_image:
  ontap_version: "9.18.1"
  vsa_image_path: GCNV/9.18.1/upgrade/cot.image.ONTAP-9.18.1.tgz
  vsa_name: x-9-18-1
  mediator_name: cvo-mediator-x-9-18-1
  is_active: true

# Informational — dry-run warns if GET /v1/imageVersions current does not match
deployment:
  vsa_image_name: x-9-18-1
  ontap_version_details: "9.18.1"

batch:
  max_concurrency: 5
  failure_threshold: 1   # SRE default. API default is 0 (no abort).

# Optional: VCP Postgres for discover (psql). Password via PGPASSWORD.
# database:
#   host: 127.0.0.1
#   port: 5432
#   name: vcp
#   user: vcp

# Explicit pool UUIDs for poolList batch mode
pool_ids: []

projects:
  netapp-us-c1-sde:
    region: us-central1
    short_name: us-c1
    project_number: ""
    cluster: ""
    service_account: otel-collector-sa@netapp-us-c1-sde.iam.gserviceaccount.com
