# OCI environment overrides for vcp-worker.
# Copy this file, fill in the <PLACEHOLDER> values for your environment,
# then pass it to Helm:
#   helm upgrade --install vcp-worker ./oci-vcp-worker-chart -n <namespace> \
#     -f values.yaml -f vcp-worker-overrides.yaml

global:
  primaryImageRegistry: "<OCIR_HOSTNAME>"          # e.g. iad.ocir.io
  primaryImageRegistryPath: "<OCIR_TENANCY_NS>"    # e.g. "idqogasfjw45"

workerConfig:
  localRegion: "<OCI_REGION>"                      # e.g. "us-ashburn-1"
  database:
    host: "<POSTGRES_HOST>"  # e.g. primary.xxx.postgresql.us-ashburn-1.oci.oraclecloud.com
  vsaVlmEncryptionKey: "<VSA_VLM_ENCRYPTION_KEY>"  # 32-byte AES-256 key; MUST match vlm-worker
  vsaMediatorImageName: "<VSA_MEDIATOR_IMAGE_OCID>"   # OCI compute image OCID for the VSA mediator
  vsaImageName: "<VSA_IMAGE_OCID>"                    # OCI compute image OCID for the VSA node
  secretUri: "<OCI_VAULT_SECRET_OCID>"                # OCI Vault secret OCID
  ociVaultOcid: "<OCI_VAULT_OCID>"                    # OCI Vault OCID
  ociMasterKeyOcid: "<OCI_MASTER_KEY_OCID>"           # OCI Vault master encryption key OCID
  ociVaultCompartmentOcid: "<OCI_VAULT_COMPARTMENT_OCID>"  # Compartment for Vault secrets
  ociCertCompartmentOcid: "<OCI_CERT_COMPARTMENT_OCID>"    # Compartment for certificates
  ociIssuerCaOcid: "<OCI_ISSUER_CA_OCID>"             # OCI Certificate Authority OCID used to issue VSA certs
  ociClientIssuerCaOcid: "<OCI_CLIENT_ISSUER_CA_OCID>" # OCI Certificate Authority OCID for mTLS client certs
  ociSeparateMtlsClientCert: true                      # Use a separate CA for mTLS client certificates
  vsaDeployedDnsName: "<VSA_DEPLOYED_DNS_NAME>"       # DNS suffix for deployed VSA hosts (e.g. "iad.vsa")
  ociVsaDnsZoneOcid: "<OCI_VSA_DNS_ZONE_OCID>"        # OCI DNS zone OCID for VSA hostnames
  ociUseTlsSniOverride: <OCI_USE_TLS_SNI_OVERRIDE>    # Replace with true or false — enable TLS SNI override for VSA
  enableAdminTempPassword: <ENABLE_ADMIN_TEMP_PASSWORD>              # true or false
  enableOciTempPasswordResetCron: <ENABLE_OCI_TEMP_PASSWORD_RESET_CRON>  # true or false
  ociTempPasswordResetAfterMinutes: <OCI_TEMP_PASSWORD_RESET_MINUTES>    # e.g. 1440 (24 hours)
  ociVsaUserBootargs: ""                              # Optional: custom VSA bootargs (e.g. "bootarg.oci.cloud_proxy_lb_endpoint=http://<IP>")
  enableOciVsaCertificateRotation: "<ENABLE_OCI_VSA_CERTIFICATE_ROTATION>"  # "true" or "false"
  ociCertificateRotationCronExpression: "<OCI_CERTIFICATE_ROTATION_CRON>"    # e.g. "0 0 * * *"

# Multi-version worker support. One Deployment + ConfigMap is rendered per entry
# so in-flight workflows keep their versioned task queue (customer-workflows-<version>)
# alive during upgrades. Append a NEW entry on every build upgrade; only remove the
# old entry after its in-flight workflows have drained. See Section 12a in
# VCP_OCI_DEPLOY_GUIDE.md and doc/architecture/designs/0011-vcp-worker_versioning-design.md.
versionsSupported:
  - name: "<IMAGE_TAG>"    # same as $TAG for the initial install
    sha: ""                # optional; used only when global.useTags=false (digest pinning)

# Image configuration (OCIR)
# NOTE: images.vcpWorker.tag is a legacy single-version fallback; versionsSupported[].name
# above wins when set. Keep it aligned with the newest versionsSupported entry.
images:
  vcpWorker:
    name: vcp-worker
    tag: "<IMAGE_TAG>"     # same as $TAG — release version from jq -r '.metadata.version' release-manifest.json
    digest: ""
