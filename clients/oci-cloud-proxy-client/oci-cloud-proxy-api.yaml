openapi: 3.0.3
info:
  title: FSN API Proxy for OCI Public APIs
  version: 0.3.1
  description: |
    Derived from the published FSN OCI Resource Proxy API (v0.3.1), TRIMMED to the
    operations VCP actually invokes through the proxy (secret create + schedule
    deletion, certificate create + schedule deletion, DNS RRSet update/delete,
    object-storage PAR create, and the secret-bundle read).

    hyperscaler/oci IS wired to the generated ogen client
    (hyperscaler/oci/oci_proxy_ogen.go). When FSN revises the contract, update this
    file, re-run `go generate ./...`, and adjust the adapters in oci_proxy_ogen.go
    if any request/response shapes differ. The ociProxyWrapper and core/ callers
    stay unchanged.

    Contract notes carried over from v0.3.1:
      - x-proxy-request-id is REQUIRED on every route (missing/blank -> HTTP 400).
      - x-proxy-validate-only=true makes the proxy validate/echo without calling OCI.
      - Request/response bodies are opaque JSON (additionalProperties: true).
      - The proxy signs outbound OCI requests with OKE workload identity.
      - proxy-error response header is true when the error was generated by the
        proxy rather than forwarded from OCI.

    v0.3.1 deltas relevant to VCP:
      - Object Storage PAR path no longer carries the /20160918 version prefix;
        it is now /n/{namespaceName}/b/{bucketName}/p (native OCI Object Storage
        path). The object-storage API-version prefix override is therefore empty
        by default.
      - DNS UpdateRRSet/DeleteRRSet accept an optional viewId query parameter for
        private DNS views (forwarded as-is; VCP does not currently set it).

    Operations the full v0.3.1 spec defines but VCP does not use (NSG, VNIC,
    private IPs, volumes, instances, boot volumes, volume attachments, certificate
    update / version-deletion, get-private-ip) are intentionally omitted here.

servers:
  - url: https://{proxyHost}
    variables:
      proxyHost:
        default: proxy.oraclecorp.com

components:
  parameters:
    XProxyRequestId:
      name: x-proxy-request-id
      in: header
      required: true
      schema:
        type: string
      description: Mandatory proxy correlation id. Missing or blank value returns HTTP 400 from the proxy.

    XProxyValidateOnly:
      name: x-proxy-validate-only
      in: header
      required: false
      schema:
        type: boolean
        default: false
      description: If true, proxy validates/parses the request and returns the parsed payload without calling OCI.

    OpcRequestId:
      name: opc-request-id
      in: header
      required: false
      schema:
        type: string
      description: OCI request id. If absent, Resource Manager generates one.

    OpcRetryToken:
      name: opc-retry-token
      in: header
      required: false
      schema:
        type: string
      description: OCI idempotency token, forwarded as-is for create/action APIs that accept it.

    IfMatch:
      name: if-match
      in: header
      required: false
      schema:
        type: string
      description: ETag for optimistic concurrency, forwarded as-is.

  headers:
    XProxyError:
      required: false
      schema:
        type: boolean
      description: Present and set to true when the response is generated by the proxy (not forwarded from OCI).

  schemas:
    OpaqueJson:
      type: object
      additionalProperties: true
      description: Opaque JSON object forwarded to/from OCI.

  requestBodies:
    OpaqueJsonBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

  responses:
    PassthroughResponse:
      description: Passthrough response from OCI, or validate-only echo when x-proxy-validate-only is true.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error400:
      description: Bad Request (OCI or proxy validation)
      headers:
        proxy-error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error401:
      description: Unauthorized (OCI or proxy)
      headers:
        proxy-error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error403:
      description: Forbidden (OCI or proxy)
      headers:
        proxy-error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error404:
      description: Not Found (OCI or proxy)
      headers:
        proxy-error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error409:
      description: Conflict (OCI or proxy)
      headers:
        proxy-error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error412:
      description: Precondition Failed (If-Match / ETag)
      headers:
        proxy-error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error429:
      description: Too Many Requests / throttling (OCI or proxy)
      headers:
        proxy-error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error500:
      description: Internal Server Error (OCI or proxy)
      headers:
        proxy-error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error502:
      description: Bad Gateway (proxy-to-OCI upstream error)
      headers:
        proxy-error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error503:
      description: Service Unavailable (OCI or proxy)
      headers:
        proxy-error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error504:
      description: Gateway Timeout (proxy-to-OCI)
      headers:
        proxy-error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

paths:
  # ──────────────────────────────────────────────────────────────────────
  # Secrets (Vault) — bundle read
  # ──────────────────────────────────────────────────────────────────────
  /20190301/secretbundles/{secretId}:
    parameters:
      - name: secretId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: GetSecretBundle
      tags: [Secrets]
      description: |
        Query parameters (e.g. stage, versionNumber) are forwarded as-is.
      parameters:
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "201": { $ref: "#/components/responses/PassthroughResponse" }
        "204": { description: No Content (OCI passthrough) }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "412": { $ref: "#/components/responses/Error412" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }

  # ──────────────────────────────────────────────────────────────────────
  # Secrets Management (Vault)
  # ──────────────────────────────────────────────────────────────────────
  /20180608/secrets:
    post:
      operationId: CreateSecret
      tags: [Secrets]
      parameters:
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
        - $ref: "#/components/parameters/OpcRetryToken"
      requestBody: { $ref: "#/components/requestBodies/OpaqueJsonBody" }
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "201": { $ref: "#/components/responses/PassthroughResponse" }
        "204": { description: No Content (OCI passthrough) }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "412": { $ref: "#/components/responses/Error412" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }

  /20180608/secrets/{secretId}/actions/scheduleDeletion:
    parameters:
      - name: secretId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: ScheduleSecretDeletion
      tags: [Secrets]
      parameters:
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody: { $ref: "#/components/requestBodies/OpaqueJsonBody" }
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "201": { $ref: "#/components/responses/PassthroughResponse" }
        "204": { description: No Content (OCI passthrough) }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "412": { $ref: "#/components/responses/Error412" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }

  # ──────────────────────────────────────────────────────────────────────
  # Certificates Management
  # ──────────────────────────────────────────────────────────────────────
  /20210224/certificates:
    post:
      operationId: CreateCertificate
      tags: [Certificates]
      parameters:
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
        - $ref: "#/components/parameters/OpcRetryToken"
      requestBody: { $ref: "#/components/requestBodies/OpaqueJsonBody" }
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "201": { $ref: "#/components/responses/PassthroughResponse" }
        "204": { description: No Content (OCI passthrough) }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "412": { $ref: "#/components/responses/Error412" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }

  /20210224/certificates/{certificateId}/actions/scheduleDeletion:
    parameters:
      - name: certificateId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: ScheduleCertificateDeletion
      tags: [Certificates]
      parameters:
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody: { $ref: "#/components/requestBodies/OpaqueJsonBody" }
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "201": { $ref: "#/components/responses/PassthroughResponse" }
        "204": { description: No Content (OCI passthrough) }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "412": { $ref: "#/components/responses/Error412" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }

  # ──────────────────────────────────────────────────────────────────────
  # DNS (RRSet)
  # ──────────────────────────────────────────────────────────────────────
  /20180115/zones/{zoneNameOrId}/records/{domain}/{rtype}:
    parameters:
      - name: zoneNameOrId
        in: path
        required: true
        schema: { type: string }
      - name: domain
        in: path
        required: true
        schema: { type: string }
      - name: rtype
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: UpdateRRSet
      tags: [DNS]
      description: |
        Pass-through update RRSet call. compartmentId, scope, and viewId query params are forwarded as-is.
      parameters:
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
        - $ref: "#/components/parameters/IfMatch"
        - name: compartmentId
          in: query
          required: false
          schema: { type: string }
        - name: scope
          in: query
          required: false
          schema: { type: string }
        - name: viewId
          in: query
          required: false
          schema: { type: string }
      requestBody: { $ref: "#/components/requestBodies/OpaqueJsonBody" }
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "201": { $ref: "#/components/responses/PassthroughResponse" }
        "204": { description: No Content (OCI passthrough) }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "412": { $ref: "#/components/responses/Error412" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }
    delete:
      operationId: DeleteRRSet
      tags: [DNS]
      description: |
        Pass-through delete RRSet call. compartmentId, scope, and viewId query params are forwarded as-is.
      parameters:
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
        - $ref: "#/components/parameters/IfMatch"
        - name: compartmentId
          in: query
          required: false
          schema: { type: string }
        - name: scope
          in: query
          required: false
          schema: { type: string }
        - name: viewId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "201": { $ref: "#/components/responses/PassthroughResponse" }
        "204": { description: No Content (OCI passthrough) }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "412": { $ref: "#/components/responses/Error412" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }

  # ──────────────────────────────────────────────────────────────────────
  # Object Storage (pre-authenticated requests)
  # ──────────────────────────────────────────────────────────────────────
  /n/{namespaceName}/b/{bucketName}/p:
    parameters:
      - name: namespaceName
        in: path
        required: true
        schema: { type: string }
      - name: bucketName
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: CreatePreauthenticatedRequest
      tags: [ObjectStorage]
      description: |
        Pass-through create PAR call. Request body is opaque JSON and is forwarded as-is.
      parameters:
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
        - $ref: "#/components/parameters/OpcRetryToken"
      requestBody: { $ref: "#/components/requestBodies/OpaqueJsonBody" }
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "201": { $ref: "#/components/responses/PassthroughResponse" }
        "204": { description: No Content (OCI passthrough) }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "412": { $ref: "#/components/responses/Error412" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }
