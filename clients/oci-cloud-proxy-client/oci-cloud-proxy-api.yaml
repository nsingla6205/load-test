openapi: 3.0.3
info:
  title: FSN API Proxy for OCI Public APIs
  version: 0.1.0
  description: |
    FSN-OGEN-MIGRATION — DUMMY / ASSUMED CONTRACT.

    This is a PLACEHOLDER spec. The operation paths, query/header parameters, and
    (opaque) request/response bodies below are ASSUMED by VCP (modelled on the OCI
    REST API), NOT published by FSN. They are stubs until FSN provides the real
    OpenAPI spec.

    IMPORTANT: hyperscaler/oci IS wired to the generated ogen client
    (hyperscaler/oci/oci_proxy_ogen.go), so these stubbed operations are what runs
    at runtime in proxy mode. When FSN publishes the real spec, REPLACE this file,
    re-run `go generate ./...`, and adjust the adapters in oci_proxy_ogen.go if any
    request/response shapes differ. The ociProxyWrapper and core/ callers stay
    unchanged.

    API version path segments below (e.g. /20180608) are the codegen defaults baked
    into oas_*_gen.go. At runtime they can be overridden via OCI_PROXY_*_API_VERSION_PREFIX
    env vars (see utils/env/env.go and hyperscaler/oci/oci_proxy_config.go).

    API version path segments (e.g. /20180608, /20190301/secretbundles) are FIXED in
    this spec and baked into oas_*_gen.go at codegen time. They are not configurable
    via environment variables. Only OCI_PROXY_BASE_URL selects the proxy host; to
    change operation paths, update this YAML and regenerate the client.

    Request/response bodies are treated as opaque JSON (additionalProperties: true);
    the proxy may validate/mutate selected fields but the contract here does not
    constrain payload shape.

servers:
  - url: https://{proxyHost}
    variables:
      proxyHost:
        default: proxy.oraclecorp.com

components:
  parameters:
    XProxyRequestId:
      name: X-Proxy-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: Parent workflow id which originated this OCI request.

    XProxyValidateOnly:
      name: X-Proxy-Validate-Only
      in: header
      required: false
      schema:
        type: boolean
        default: false
      description: If true, proxy validates but does not call OCI API.

    OpcRequestId:
      name: opc-request-id
      in: header
      required: false
      schema:
        type: string
      description: opc request id of the original workflow which originated this OCI request.

    OpcRetryToken:
      name: opc-retry-token
      in: header
      required: false
      schema:
        type: string
      description: OCI idempotency token (forwarded as-is).

    IfMatch:
      name: if-match
      in: header
      required: false
      schema:
        type: string
      description: ETag for optimistic concurrency (forwarded as-is).

  headers:
    XProxyError:
      required: false
      schema:
        type: boolean
      description: Present and set to true when the response is generated by the proxy (not forwarded from OCI).

  schemas:
    OpaqueJson:
      type: object
      additionalProperties: true
      description: Opaque JSON object forwarded to/from OCI.

  requestBodies:
    OpaqueJsonBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

  responses:
    PassthroughResponse:
      description: Passthrough response from OCI.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error400:
      description: Bad Request (OCI or proxy)
      headers:
        X-Proxy-Error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error401:
      description: Unauthorized (OCI or proxy)
      headers:
        X-Proxy-Error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error403:
      description: Forbidden (OCI or proxy)
      headers:
        X-Proxy-Error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error404:
      description: Not Found (OCI or proxy)
      headers:
        X-Proxy-Error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error409:
      description: Conflict (OCI or proxy)
      headers:
        X-Proxy-Error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error412:
      description: Precondition Failed (If-Match / ETag)
      headers:
        X-Proxy-Error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error429:
      description: Too Many Requests / throttling (OCI or proxy)
      headers:
        X-Proxy-Error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error500:
      description: Internal Server Error (OCI or proxy)
      headers:
        X-Proxy-Error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error502:
      description: Bad Gateway (proxy-to-OCI upstream error)
      headers:
        X-Proxy-Error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error503:
      description: Service Unavailable (OCI or proxy)
      headers:
        X-Proxy-Error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

    Error504:
      description: Gateway Timeout (proxy-to-OCI)
      headers:
        X-Proxy-Error:
          $ref: "#/components/headers/XProxyError"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpaqueJson"

paths:
  # ──────────────────────────────────────────────────────────────────────
  # Secrets (Vault) — partial; extend as FSN publishes more operations.
  # ──────────────────────────────────────────────────────────────────────
  /20190301/secretbundles/{secretId}:
    get:
      operationId: GetSecretBundle
      tags: [Secrets]
      parameters:
        - name: secretId
          in: path
          required: true
          schema:
            type: string
        - name: stage
          in: query
          required: false
          description: Rotation stage to read (e.g. CURRENT). Mutually exclusive with versionNumber.
          schema:
            type: string
        - name: versionNumber
          in: query
          required: false
          description: Specific secret version number to read. Mutually exclusive with stage.
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }

  # ──────────────────────────────────────────────────────────────────────
  # Secrets / Vault (management)
  # ──────────────────────────────────────────────────────────────────────
  /20180608/secrets:
    post:
      operationId: CreateSecret
      tags: [Secrets]
      parameters:
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
        - $ref: "#/components/parameters/OpcRetryToken"
      requestBody: { $ref: "#/components/requestBodies/OpaqueJsonBody" }
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "412": { $ref: "#/components/responses/Error412" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }

  /20180608/secrets/{secretId}/actions/scheduleDeletion:
    post:
      operationId: ScheduleSecretDeletion
      tags: [Secrets]
      parameters:
        - name: secretId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
        - $ref: "#/components/parameters/OpcRetryToken"
      requestBody: { $ref: "#/components/requestBodies/OpaqueJsonBody" }
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "412": { $ref: "#/components/responses/Error412" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }

  # ──────────────────────────────────────────────────────────────────────
  # Certificates
  # ──────────────────────────────────────────────────────────────────────
  /20210224/certificates:
    post:
      operationId: CreateCertificate
      tags: [Certificates]
      parameters:
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
        - $ref: "#/components/parameters/OpcRetryToken"
      requestBody: { $ref: "#/components/requestBodies/OpaqueJsonBody" }
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "412": { $ref: "#/components/responses/Error412" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }
  /20210224/certificates/{certificateId}/actions/scheduleDeletion:
    post:
      operationId: ScheduleCertificateDeletion
      tags: [Certificates]
      parameters:
        - name: certificateId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
        - $ref: "#/components/parameters/OpcRetryToken"
      requestBody: { $ref: "#/components/requestBodies/OpaqueJsonBody" }
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "412": { $ref: "#/components/responses/Error412" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }

  # ──────────────────────────────────────────────────────────────────────
  # DNS (RRSet)
  # ──────────────────────────────────────────────────────────────────────
  /20180115/zones/{zoneNameOrId}/records/{domain}/{rtype}:
    parameters:
      - name: zoneNameOrId
        in: path
        required: true
        schema: { type: string }
      - name: domain
        in: path
        required: true
        schema: { type: string }
      - name: rtype
        in: path
        required: true
        schema: { type: string }
      - name: scope
        in: query
        required: false
        schema: { type: string }
    put:
      operationId: UpdateRRSet
      tags: [DNS]
      parameters:
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
      requestBody: { $ref: "#/components/requestBodies/OpaqueJsonBody" }
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "412": { $ref: "#/components/responses/Error412" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }
    delete:
      operationId: DeleteRRSet
      tags: [DNS]
      parameters:
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "412": { $ref: "#/components/responses/Error412" }
        "429": { $ref: "#/components/responses/Error429" }
        "500": { $ref: "#/components/responses/Error500" }
        "502": { $ref: "#/components/responses/Error502" }
        "503": { $ref: "#/components/responses/Error503" }
        "504": { $ref: "#/components/responses/Error504" }

  # ──────────────────────────────────────────────────────────────────────
  # Object Storage (pre-authenticated requests)
  # ──────────────────────────────────────────────────────────────────────
  /20160918/n/{namespaceName}/b/{bucketName}/p:
    post:
      operationId: CreatePreauthenticatedRequest
      tags: [ObjectStorage]
      parameters:
        - name: namespaceName
          in: path
          required: true
          schema: { type: string }
        - name: bucketName
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/XProxyRequestId"
        - $ref: "#/components/parameters/XProxyValidateOnly"
        - $ref: "#/components/parameters/OpcRequestId"
      requestBody: { $ref: "#/components/requestBodies/OpaqueJsonBody" }
      responses:
        "200": { $ref: "#/components/responses/PassthroughResponse" }
