name: VSA Cluster API Operations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which catalog to load: config.autopush.yaml, config.stage.yaml, or config.prod.yaml"
        required: true
        type: choice
        default: autopush
        options:
          - autopush
          - stage
          - prod
      project:
        description: "SDE producer project id (config.projects key), e.g. netapp-au-se1-autopush-sde-tst"
        required: true
        type: string
        default: netapp-au-se1-autopush-sde-tst
      # Operations come from domain modules registered via operations.py.
      # Upgrade handlers live in scripts/cluster_upgrade.py.
      operation:
        description: "Core API operation to run"
        required: true
        type: choice
        default: list-images
        options:
          - list-images
          - verify
          - register-image
          - upgrade
      ontap_version:
        description: "Target ONTAP version, e.g. 9.18.1. Must exist in config image_versions. Empty uses the deployment default."
        required: false
        type: string
        default: ""
      pool_ids:
        description: "upgrade: explicit pool UUIDs, comma or space separated (poolList selection). Takes precedence over percentage."
        required: false
        type: string
        default: ""
      percentage:
        description: "upgrade: percentage of eligible pools to select (1-100) when no pool_ids are given"
        required: false
        type: string
        default: ""
      max_concurrency:
        description: "upgrade: pools upgraded in parallel"
        required: false
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "5"
          - "10"
      progress_id:
        description: "verify: batchUpgradeId or jobId to confirm as COMPLETED"
        required: false
        type: string
        default: ""
      change_ticket:
        description: "Change record for write operations; required in prod"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Write operations print the request they would send instead of sending it"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: vsa-cluster-api-${{ inputs.environment }}-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  run-operation:
    name: ${{ inputs.environment }} ${{ inputs.project }} / ${{ inputs.operation }}
    runs-on: [self-hosted, linux]
    # An upgrade polls to a terminal status, so the job must outlive the CLI poll
    # budget in config.<env>.yaml (poll.timeout_minutes, 720 by default).
    timeout-minutes: ${{ inputs.operation == 'upgrade' && 740 || 30 }}

    steps:
      - name: Validate dispatch
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          ONTAP_VERSION: ${{ inputs.ontap_version }}
          POOL_IDS: ${{ inputs.pool_ids }}
          PERCENTAGE: ${{ inputs.percentage }}
          PROGRESS_ID: ${{ inputs.progress_id }}
          CHANGE_TICKET: ${{ inputs.change_ticket }}
          ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            list-images) ;;
            verify)
              if [[ -z "$PROGRESS_ID" ]]; then
                echo "::notice::no progress_id given; verify will only check the image catalog"
              fi
              ;;
            register-image)
              if [[ -z "$ONTAP_VERSION" ]]; then
                echo "::error::register-image needs ontap_version"
                exit 1
              fi
              ;;
            upgrade)
              if [[ -n "$POOL_IDS" && -n "$PERCENTAGE" ]]; then
                echo "::error::pass pool_ids or percentage, not both"
                exit 1
              fi
              if [[ -z "$POOL_IDS" && -z "$PERCENTAGE" ]]; then
                echo "::error::upgrade needs pool_ids or percentage"
                exit 1
              fi
              if [[ -n "$PERCENTAGE" ]] && { ! [[ "$PERCENTAGE" =~ ^[0-9]+$ ]] || [[ "$PERCENTAGE" -lt 1 ]] || [[ "$PERCENTAGE" -gt 100 ]]; }; then
                echo "::error::percentage must be 1-100, got '$PERCENTAGE'"
                exit 1
              fi
              ;;
            *)
              echo "::error::unknown operation $OPERATION"
              exit 1
              ;;
          esac

          # Mirrors governance.require_change_ticket in config.prod.yaml so a
          # missing change record fails before any cluster access.
          case "$OPERATION" in
            register-image|upgrade)
              if [[ "$ENVIRONMENT" == "prod" && "$DRY_RUN" != "true" && -z "$CHANGE_TICKET" ]]; then
                echo "::error::$OPERATION in prod needs change_ticket"
                exit 1
              fi
              ;;
          esac

      # Self-hosted runners reuse the workspace. Files owned by another user
      # (e.g. .cursor/agents) make actions/checkout fail on git reset / rmdir.
      - name: Repair self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-.}"
          if [[ -d "$ws" ]]; then
            sudo -n chown -R "$(id -u):$(id -g)" "$ws" || true
            sudo -n rm -f "$ws/.git/index.lock" || true
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automations/cluster-api/requirements.txt

      - name: Install automation dependencies
        run: pip install -r automations/cluster-api/requirements.txt

      - name: Resolve producer from config
        id: project
        shell: bash
        env:
          PROJECT_ID: ${{ inputs.project }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          env = os.environ["ENVIRONMENT"]
          config_path = Path(f"automations/cluster-api/config.{env}.yaml")
          config = yaml.safe_load(config_path.read_text())
          project_id = os.environ["PROJECT_ID"]
          file_env = (config.get("environment") or "").strip()
          if file_env and file_env != env:
              raise SystemExit(f"{config_path} is environment={file_env}, dispatch was {env}")
          entry = (config.get("projects") or {}).get(project_id)
          if not isinstance(entry, dict):
              known = ", ".join(sorted((config.get("projects") or {})))
              raise SystemExit(f"unknown project {project_id}; config has: {known}")
          region = (entry.get("region") or "").strip()
          cluster = (entry.get("cluster") or "").strip()
          service_account = (entry.get("service_account") or "").strip()
          if not region:
              raise SystemExit(f"project {project_id} is missing region")
          if not service_account:
              raise SystemExit(f"project {project_id} is missing service_account")
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a") as fh:
              fh.write(f"project_id={project_id}\n")
              fh.write(f"gcp_region={region}\n")
              fh.write(f"catalog_cluster={cluster}\n")
              fh.write(f"service_account={service_account}\n")
          PY

      # WIF authenticates as the producer-project SA from config.projects.<id>.service_account.
      # That same SA signs the core-api JWT (iam.serviceAccounts.signJwt) and runs kubectl.
      # Each regional SA must allow this workflow's WIF principal as workloadIdentityUser.
      #
      # Uses the AR_WLI_POOL provider (same as build_common/weekly cleanup), not
      # GCP_WORKLOAD_IDENTITY_PROVIDER: that pool lives in gcnv-vsa-prod, and
      # constraints/iam.allowedPolicyMemberDomains rejects its principals in SDE
      # producer projects, which are in a different org.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ vars.AR_GCP_PROJ_NUM }}/locations/global/workloadIdentityPools/${{ vars.AR_WLI_POOL }}/providers/${{ vars.AR_WLI_PROV }}"
          service_account: ${{ steps.project.outputs.service_account }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin,kubectl

      - name: Resolve project number and GKE cluster
        id: gke
        shell: bash
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          GCP_REGION: ${{ steps.project.outputs.gcp_region }}
          CATALOG_CLUSTER: ${{ steps.project.outputs.catalog_cluster }}
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          CLUSTER="$CATALOG_CLUSTER"

          if [[ -z "$CLUSTER" ]]; then
            mapfile -t CANDIDATES < <(
              gcloud container clusters list \
                --project "$PROJECT_ID" \
                --filter="location:$GCP_REGION AND NOT name~backup-restore" \
                --format='value(name)'
            )
            if [[ "${#CANDIDATES[@]}" -ne 1 ]]; then
              echo "::error::Expected one GKE cluster in $PROJECT_ID/$GCP_REGION; found ${#CANDIDATES[@]}. Set projects.$PROJECT_ID.cluster in config.${{ inputs.environment }}.yaml."
              printf '%s\n' "${CANDIDATES[@]}"
              exit 1
            fi
            CLUSTER="${CANDIDATES[0]}"
          fi

          echo "project_number=$PROJECT_NUMBER" >> "$GITHUB_OUTPUT"
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"

      - name: Connect to producer GKE
        shell: bash
        run: |
          gcloud container clusters get-credentials "${{ steps.gke.outputs.cluster }}" \
            --region "${{ steps.project.outputs.gcp_region }}" \
            --project "${{ steps.project.outputs.project_id }}"
          kubectl auth can-i get services -n vcp

      # Supervised because kubectl port-forward drops connections and a regional
      # batch upgrade is polled for hours.
      - name: Port-forward core-api
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/core-api-port-forward.log"
          : > "$LOG"
          setsid bash -c '
            while true; do
              kubectl -n vcp port-forward svc/core-service 8080:8080 >>"'"$LOG"'" 2>&1 || true
              echo "$(date -Is) port-forward exited, restarting in 5s" >>"'"$LOG"'"
              sleep 5
            done
          ' >/dev/null 2>&1 &
          echo "$!" > "$RUNNER_TEMP/core-api-port-forward.pid"

          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$LOG"
          exit 1

      # Write operations execute and then poll to a terminal status. The CLI exits
      # non-zero on FAILED/CANCELLED and writes failure details to the run summary.
      # Operation parameters are declared in operations.py, so this step only maps
      # dispatch inputs onto the flags of the selected operation.
      - name: Run core-api operation
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
          ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          ONTAP_VERSION: ${{ inputs.ontap_version }}
          POOL_IDS: ${{ inputs.pool_ids }}
          PERCENTAGE: ${{ inputs.percentage }}
          MAX_CONCURRENCY: ${{ inputs.max_concurrency }}
          PROGRESS_ID: ${{ inputs.progress_id }}
          CHANGE_TICKET: ${{ inputs.change_ticket }}
          DRY_RUN: ${{ inputs.dry_run }}
          VCP_PROJECT_NUMBER: ${{ steps.gke.outputs.project_number }}
          VCP_CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BASE=(
            python -u automations/cluster-api/scripts/cluster_api.py
            --config "automations/cluster-api/config.${ENVIRONMENT}.yaml"
            --environment "$ENVIRONMENT"
            --project "$PROJECT"
          )
          [[ -z "$ONTAP_VERSION" ]] || BASE+=(--ontap-version "$ONTAP_VERSION")
          [[ -z "$CHANGE_TICKET" ]] || BASE+=(--change-ticket "$CHANGE_TICKET")
          [[ "$DRY_RUN" != "true" ]] || BASE+=(--dry-run)

          case "$OPERATION" in
            list-images)
              "${BASE[@]}" list-images
              ;;
            verify)
              ARGS=()
              [[ -z "$PROGRESS_ID" ]] || ARGS+=(--progress-id "$PROGRESS_ID")
              "${BASE[@]}" verify "${ARGS[@]}"
              ;;
            register-image)
              "${BASE[@]}" register-image
              ;;
            upgrade)
              # Naming a target ONTAP version pins that build instead of the
              # deployment default, which is what forceUpgrade means to the API.
              ARGS=(--max-concurrency "$MAX_CONCURRENCY")
              [[ -z "$ONTAP_VERSION" ]] || ARGS+=(--force-upgrade)
              if [[ -n "$POOL_IDS" ]]; then
                read -ra POOLS <<< "${POOL_IDS//,/ }"
                ARGS+=(--pool-ids "${POOLS[@]}")
              else
                ARGS+=(--percentage "$PERCENTAGE")
              fi
              "${BASE[@]}" upgrade "${ARGS[@]}"
              ;;
          esac

      - name: Show port-forward log
        if: failure()
        run: cat "$RUNNER_TEMP/core-api-port-forward.log" || true

      - name: Stop core-api port-forward
        if: always()
        shell: bash
        run: |
          PID_FILE="$RUNNER_TEMP/core-api-port-forward.pid"
          if [[ -f "$PID_FILE" ]]; then
            PGID="$(cat "$PID_FILE")"
            # setsid makes the supervisor its own group leader, so kill the group
            # to also stop the kubectl child.
            kill -TERM -- "-$PGID" 2>/dev/null || kill -TERM "$PGID" 2>/dev/null || true
          fi
