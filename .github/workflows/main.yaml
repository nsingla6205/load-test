name: Main Workflow
on:
  pull_request:
    branches:
      - main
      - release/2*
      - release/oci/2*
    types: [opened, edited, synchronize]

permissions:
  packages: write
  contents: read
  id-token: write
  security-events: write
  actions: write

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  setup-vsacictl:
    name: Setup vsacictl
    uses: ./.github/workflows/setup-vsacictl.yaml
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GHVSA_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: go mod tidy

      - name: Cache Go modules
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

  common:
    needs: setup-vsacictl
    timeout-minutes: 10
    runs-on: [ ubuntu-22.04 ]
    container:
      image: ghcr.io/vcp-vsa-control-plane/vsa-builder:v9
      options: --user root
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Install vsacictl
        uses: ./.github/actions/install-vsacictl
        with:
          cache-key: ${{ needs.setup-vsacictl.outputs.cache-key }}

      - name: Fetch token
        uses: actions/create-github-app-token@v2
        id: token
        with:
          owner: ${{ github.repository_owner }}
          app-id: ${{ secrets.VCP_CI_GH_APP_ID }}
          private-key: ${{ secrets.VCP_CI_GH_PRIVATE_KEY }}
          repositories: |
            vsa-control-plane

      - name: Run Jira check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          JIRA_API_TOKEN: ${{ secrets.VCP_CI_JIRA_BOT_PAT }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          BASE_BRANCH: ${{github.base_ref}}
        run: vsacictl jira allow_merge

  # Derives the unit-test matrix from go.work (single source of truth) so the set
  # of tested modules/shards can never drift from go.work. The shard policy (which
  # modules split, and into how many) lives in the unit-test tool; adding a module
  # to go.work automatically adds a gate shard for it.
  discover_modules:
    name: Discover modules
    needs: setup-vsacictl
    runs-on: [ ubuntu-22.04 ]
    container:
      image: ghcr.io/vcp-vsa-control-plane/vsa-builder:v9
      options: --user root
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install vsacictl
        uses: ./.github/actions/install-vsacictl
        with:
          cache-key: ${{ needs.setup-vsacictl.outputs.cache-key }}

      - name: Build unit-test matrix from go.work
        id: matrix
        run: |
          echo "targets=$(vsacictl unit-test list-modules)" >> "$GITHUB_OUTPUT"
          echo "count=$(vsacictl unit-test list-modules --count)" >> "$GITHUB_OUTPUT"

  # PR gate shards. One job per matrix entry so they run in parallel across
  # runners. Each shard runs tests ONCE with coverage: the pass/fail is the gate
  # signal AND the produced profile is uploaded so coverage is computed from the
  # same run (no separate full-suite coverage job).
  #
  # The matrix is generated from go.work by `discover_modules`: `module` selects
  # the workspace module and `shard` (i/N) splits a large module's packages across
  # several parallel jobs (shard policy lives in the unit-test tool).
  #
  # These shards report as `unit_tests (<name>)`. The single required status
  # check is the `unit_tests` gate below, which aggregates all shards.
  unit_tests_modules:
    name: unit_tests (${{ matrix.target.name }})
    needs: [setup-vsacictl, discover_modules]
    runs-on: [ self-hosted, linux ]
    env:
      HOME: /tmp/github-home
    strategy:
      fail-fast: false
      # Cap how many shards run at once so the gate does not occupy too many
      # self-hosted runners simultaneously; remaining shards queue for a slot.
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.discover_modules.outputs.targets) }}
    container:
      image: ghcr.io/vcp-vsa-control-plane/vsa-builder:v9
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install vsacictl
        uses: ./.github/actions/install-vsacictl
        with:
          cache-key: ${{ needs.setup-vsacictl.outputs.cache-key }}

      # Per-module cache (save + restore). A module-scoped key means each shard
      # persists its OWN compiled objects across runs, so a later push only
      # recompiles the packages that actually changed (the dominant cost on cold
      # runners). restore-keys lets a new go.sum still warm-start from the
      # previous cache. NOTE: running with coverage disables Go's *test-result*
      # cache, so tests re-execute each run; the compile cache is the win here.
      - name: Cache Go build cache (per shard)
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-ut-${{ matrix.target.name }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-ut-${{ matrix.target.name }}-
            ${{ runner.os }}-go-ut-${{ matrix.target.module }}-
            ${{ runner.os }}-go-

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GHVSA_PAT }}@github.com/".insteadOf "https://github.com/"

      # One run, used for both the gate and coverage. Produces coverage.out for
      # this shard, uploaded below and merged in `coverage_merge`. Matrix values
      # are passed via env (not interpolated into the script) to avoid injection.
      - name: Run golang unit tests with coverage
        env:
          MODULE: ${{ matrix.target.module }}
          SHARD: ${{ matrix.target.shard }}
        run: vsacictl unit-test --module "$MODULE" --shard "$SHARD"

      - name: Upload shard coverage fragment
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.target.name }}
          retention-days: 1
          path: coverage.out
          if-no-files-found: ignore

  # Single required status check that fronts the parallel module shards above.
  # Branch protection should require `unit_tests` (not the individual shards).
  # It turns green only when every `unit_tests (<module>)` shard succeeds.
  unit_tests:
    name: unit_tests
    needs: unit_tests_modules
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all module shards passed
        env:
          RESULT: ${{ needs.unit_tests_modules.result }}
        run: |
          echo "unit_tests_modules aggregate result: ${RESULT}"
          if [ "${RESULT}" != "success" ]; then
            echo "One or more unit_tests (<name>) shards did not succeed."
            exit 1
          fi
          echo "All unit_tests module shards passed."

  # Stitches the per-module coverage fragments (uploaded by unit_tests_modules)
  # into a single filtered coverage.out used by the coverage / pr-coverage gates.
  # No tests run here, so it is fast.
  coverage_merge:
    needs: [unit_tests_modules, setup-vsacictl, discover_modules]
    runs-on: [ self-hosted, linux ]
    env:
      HOME: /tmp/github-home
    container:
      image: ghcr.io/vcp-vsa-control-plane/vsa-builder:v9
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install vsacictl
        uses: ./.github/actions/install-vsacictl
        with:
          cache-key: ${{ needs.setup-vsacictl.outputs.cache-key }}

      - name: Download module coverage fragments
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-fragments

      # --expected guards against merging partial coverage: it must find one
      # fragment per matrix shard, otherwise it fails instead of reporting
      # coverage computed from incomplete data.
      - name: Merge coverage fragments
        env:
          EXPECTED: ${{ needs.discover_modules.outputs.count }}
        run: vsacictl unit-test merge --inputs coverage-fragments --filtered --expected "$EXPECTED"

      - name: Upload merged coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage.out
          retention-days: 1
          path: coverage.out

  coverage:
    needs: [coverage_merge, setup-vsacictl]
    runs-on: [ self-hosted, linux ]
    env:
      HOME: /tmp/github-home
    container:
      image: ghcr.io/vcp-vsa-control-plane/vsa-builder:v9
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install vsacictl
        uses: ./.github/actions/install-vsacictl
        with:
          cache-key: ${{ needs.setup-vsacictl.outputs.cache-key }}

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage.out
          path: .

      - name: Run golang coverage
        env:
          COVERAGE_THRESHOLD: ${{ vars.UNIT_TEST_THRESHOLD || 90 }}
        run: vsacictl unit-test coverage

  pr-coverage:
    needs: [coverage_merge, setup-vsacictl]
    runs-on: [ self-hosted, linux ]
    env:
      HOME: /tmp/github-home
    container:
      image: ghcr.io/vcp-vsa-control-plane/vsa-builder:v9
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install vsacictl
        uses: ./.github/actions/install-vsacictl
        with:
          cache-key: ${{ needs.setup-vsacictl.outputs.cache-key }}

      - name: Install tools
        run: |
          python3 -m pip install diff-cover==9.2.4
          # gocov v1.2.1 pins golang.org/x/tools@v0.13.0, which fails to compile on
          # Go 1.25+ (invalid array length in internal/tokeninternal). Build gocov and
          # gocov-xml in a throwaway module against a newer x/tools so the produced
          # coverage.xml (and diff-cover gating) stays identical.
          tooldir="$(mktemp -d)"
          (
            cd "$tooldir"
            export GOFLAGS=-mod=mod
            go mod init toolbuild
            go get github.com/axw/gocov/gocov@latest
            go get github.com/AlekSi/gocov-xml@latest
            go get golang.org/x/tools@v0.37.0
            go build -o /usr/local/bin/gocov github.com/axw/gocov/gocov
            go build -o /usr/local/bin/gocov-xml github.com/AlekSi/gocov-xml
          )
          rm -rf "$tooldir"

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage.out
          path: .

      - name: Convert coverage to XML
        run: |
          gocov convert coverage.out | gocov-xml > coverage.xml

      - name: Fail if coverage is insufficient
        shell: bash
        run: |
          diff-cover coverage.xml --compare-branch=origin/main --fail-under=80

  verify_generated:
    name: Verify Generated
    runs-on: ubuntu-latest
    env:
      HOME: /tmp/github-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GHVSA_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Verify generated ONTAP Rest client code
        run: |
          # Get the PR branch name
          PR_BRANCH=$(echo $GITHUB_HEAD_REF)
          echo "Pull request branch: $PR_BRANCH"

          # Fetch the PR branch
          git fetch origin $PR_BRANCH

          # Switch to the PR branch
          git checkout $PR_BRANCH

          # Verify ontap rest client code
          cd ./scripts
          ./verify-ontap.sh

      - name: Verify generated retry engine wrapper for DB
        run: |
          # Get the PR branch name
          PR_BRANCH=$(echo $GITHUB_HEAD_REF)
          echo "Pull request branch: $PR_BRANCH"

          # Fetch the PR branch
          git fetch origin $PR_BRANCH

          # Switch to the PR branch
          git checkout $PR_BRANCH

          # Verify retry engine code
          cd ./scripts
          ./verify-retry-engine.sh vcp database
          ./verify-retry-engine.sh metrics database/telemetry

  verify_build:
    name: Verify build
    needs: setup-vsacictl
    runs-on: [ self-hosted, linux ]
    env:
      HOME: /tmp/github-home
    container:
      image: ghcr.io/vcp-vsa-control-plane/vsa-builder:v9
      options: --user root
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GHVSA_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Reset corrupt Go module cache used by the build container
        run: |
          # The prod build runs in an INNER container that bind-mounts the HOST
          # $(go env GOMODCACHE) (see Makefile build-all-binaries-prod). This host
          # cache is persistent and separate from this job container's own cache.
          # With concurrency cancel-in-progress enabled, a cancelled run can
          # interrupt module extraction and leave the shared host cache broadly
          # corrupt (many "open .../foo.go: no such file or directory" and
          # "//go:embed pattern ...: no matching files found" errors that survive
          # re-runs). Reset that host cache via the SAME mount the build uses so Go
          # re-downloads everything cleanly. Disk headroom is ample and the build
          # container authenticates via GHVSA_PAT for private modules.
          docker run --rm --user root -e GOMODCACHE=/gomodcache \
            -v "$(go env GOMODCACHE)":/gomodcache \
            ghcr.io/vcp-vsa-control-plane/vsa-builder:v9 sh -c '
              echo "Host module-cache disk usage:"; df -h /gomodcache || true
              go clean -modcache || rm -rf /gomodcache/* || true
              echo "Module cache reset."'

      - name: Build images
        env:
          IMAGES_TAG: "test-build" # Use a temporary tag for verification
          GHVSA_PAT: ${{ secrets.GHVSA_PAT }}
        run: |
          make clean-artifacts build-all-binaries-prod || exit 1
          skaffold config set default-repo ""
          skaffold build || exit 1
          make vcp-db-migrate-image imageVersion=test-build || exit 1
          make vcp-cloudrun-deployer-linux-image imageVersion=test-build || exit 1
  
  verify_autogen_code:
    name: Verify autogen code
    needs: setup-vsacictl
    runs-on: [ self-hosted, linux ]
    env:
      HOME: /tmp/github-home
    container:
      image: ghcr.io/vcp-vsa-control-plane/vsa-builder:v9
      options: --user root
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GHVSA_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Clean Workspace
        run: |
          git reset --hard
          if [ -f .gitmodules ] && [ -s .gitmodules ]; then git submodule foreach git reset --hard; fi
          git clean -fd
      - name: Verify autogen code
        run: make verify-generated
      
  lint:
    needs: setup-vsacictl
    runs-on: [self-hosted, linux]
    env:
      HOME: /tmp/github-home
    container:
      image: ghcr.io/vcp-vsa-control-plane/vsa-builder:v9
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install vsacictl
        uses: ./.github/actions/install-vsacictl
        with:
          cache-key: ${{ needs.setup-vsacictl.outputs.cache-key }}

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GHVSA_PAT }}@github.com/".insteadOf "https://github.com/"

      # The vsa-builder image still ships golangci-lint v2.1.2 (built with go1.24),
      # which refuses to lint a module targeting go1.25.x. Override it with a
      # go1.25-built release until the builder image is rebuilt (see builder.sh).
      - name: Install go1.25-compatible golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b /usr/local/bin v2.6.2
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          /usr/local/bin/golangci-lint version

      - name: Run golangci-lint script
        run: vsacictl lint

  call-integration-test:
    needs: [build, common, unit_tests, setup-vsacictl]
    uses: ./.github/workflows/integrationtest.yaml
    secrets: inherit
    if: github.event_name == 'pull_request'
    with:
      cache-key: ${{ needs.setup-vsacictl.outputs.cache-key }}
      vsa_control_plane_branch: ${{ github.head_ref }}
