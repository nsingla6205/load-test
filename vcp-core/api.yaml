              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
  /v1/externalClusters/onboard:
    post:
      tags:
        - externalClusters
      summary: Onboard one or more external ONTAP cluster hosts
      description: |
        Registers one or more external ONTAP cluster hosts in the control
        plane at the specified location. Creates a persistent record per host
        with the supplied management endpoint and admin username. This is a
        synchronous operation (no long-running operation or job).
      operationId: v1_onboardExternalCluster
      parameters:
        - $ref: '#/components/parameters/xCorrelationIdHeader'
      requestBody:
        description: Location and host(s) to onboard, along with admin credentials.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalClusterOnboardRequest_v1'
            example:
              locationId: us-central1
              hosts:
                - hostName: ontap-hw-cluster-01.example.com
                  adminCredentials:
                    username: admin
                    password: S3cr3tP@ssw0rd
                  description: Primary DR site ONTAP cluster
                  label: "type=SAPHANA"
                  protocol: INSECURE_HTTPS
                  managementIp: 10.10.10.50
      responses:
        "201":
          description: External cluster host records created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalClusterHostResource_v1'
              example:
                - externalClusterId: "9760acf5-4638-11e7-9bdb-020073ca3333"
                  locationId: us-central1
                  hostName: ontap-hw-cluster-01
                  adminUsername: admin
