  - url: https://netapp.googleapis.com/
tags:
  - name: accounts
    description: Account operations
  - name: health
    description: Health check operations
  - name: pools
    description: Pool operations
  - name: expertMode
    description: Expert mode operations  
  - name: clusters
    description: Cluster upgrade operations
  - name: externalClusters
    description: External (hardware) cluster onboarding operations
  - name: accounts
    description: Account host pinning operations
  - name: replications
    description: Replication operations
  - name: expertMode
    description: Expert mode operations
  - name: addressRanges
    description: Address range operations
  - name: regions
    description: Everything about regions
  - name: zones
    description: Everything about zones
  - name: ipranges
    description: Everything about IP ranges
  - name: interclusterLifs
    description: Intercluster LIF operations
  - name: svms
    description: SVM operations
paths:
