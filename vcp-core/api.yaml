      title: UpdateVolumeDatabaseValueVolumeAttributes
      type: object
      description: >-
        Mirrors (a subset of) the volume_attributes JSONB column. For now only isDataProtection is
        supported here, since it's the only volumeAttributes field with real business logic wired
        up (used by the Atom SO -> VSA migration flow to flip a hidden DP/2NDR volume to RW
        (isDataProtection=false) or mark it as DP/2NDR (isDataProtection=true)). The remaining
        VolumeAttributes fields will be added once their update semantics are implemented.
      properties:
        isDataProtection:
          title: isDataProtection
          type: boolean
          description: True marks the volume as DP/2NDR; false marks it as RW.
          example: false
