          title: maintenanceMode
          type: boolean
          description: Flag indicating whether host is usable for volume placement
          example: true
          default: true
          x-nullable: false
          x-omitempty: false
        ontapVersion:
          title: version
          type: string
          readOnly: true
          description: The version of the host
          example: 9.4.1
        ipAddress:
          title: ipAddress
          type: string
          description: The IP address of the host
          example: 10.0.0.37
        port:
          title: port
          type: integer
          format: int32
          description: The port for the host
          minimum: 1
          maximum: 65535
          example: 8080
        protocol:
          title: protocol
          type: string
          readOnly: true
          description: The protocol used for communicating with the host.
          enum:
            - HTTP
            - HTTPS
            - INSECURE_HTTPS
          example: INSECURE_HTTPS
        username:
          title: username
          type: string
          description: The username for the host
          example: admin
        password:
          title: password
          type: string
          description: The password for the host. If HOST_RSA_ENCRYPTION_REQUIRED is true then this requires ´x-rsa-public-key´ to be set, otherwise a dummy password is returned
          example: some-secret-password
        lifeCycleState:
          title: lifeCycleState
          type: string
          readOnly: true
          description: The current lifecycle state of the resource
          enum:
            - CREATING
            - CREATED
            - IN_USE
            - DISABLED
            - DELETED
            - ERROR
          example: "CREATED"
