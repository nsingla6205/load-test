  github.com/vcp-vsa-control-Plane/vsa-control-plane/vcp-core/servergen:
    config:
      dir: "{{.InterfaceDir}}"
      inpackage: True
    interfaces:
      Handler:
  github.com/vcp-vsa-control-Plane/vsa-control-plane/core/ontap-rest:
    config:
      dir: "{{.InterfaceDir}}"
      inpackage: True
    interfaces:
      ClusterClient:
      NetworkingClient:
      Poller:
      RESTClient:
      SANClient:
      NASClient:
      SecurityClient:
      StorageClient:
      SVMClient:
      SnapmirrorClient:
      CloudClient:
      NameServicesClient:
  github.com/vcp-vsa-control-Plane/vsa-control-plane/core/vsa:
    config:
      dir: "{{.InterfaceDir}}"
      inpackage: True
    interfaces:
      Provider:
  github.com/vcp-vsa-control-Plane/vsa-control-plane/core/scheduler:
    config:
      dir: "{{.InterfaceDir}}"
      inpackage: True
    interfaces:
      Scheduler:
  github.com/vcp-vsa-control-Plane/vsa-control-plane/hyperscaler:
    config:
      dir: "{{.InterfaceDir}}"
      inpackage: True
    interfaces:
      Services:
  github.com/vcp-vsa-control-Plane/vsa-control-plane/clients/cvp:
    config:
      dir: "{{.InterfaceDir}}"
      inpackage: True
      recursive: True
      include-regex: "ClientService"
  github.com/vcp-vsa-control-Plane/vsa-control-plane/clients/google-proxy-client:
    config:
      inpackage: True
      dir: "{{.InterfaceDir}}"
    interfaces:
      Invoker:
  github.com/vcp-vsa-control-Plane/vsa-control-plane/clients/vlm:
    config:
      dir: "{{.InterfaceDir}}"
      inpackage: True
      replace-type:
        - "go.temporal.io/sdk/internal=go.temporal.io/sdk/workflow"
    interfaces:
      VlmWorkflowClient:
  github.com/vcp-vsa-control-Plane/vsa-control-plane/workflow_engine:
    config:
      inpackage: True
      dir: "{{.InterfaceDir}}"
      replace-type:
        - "go.temporal.io/sdk/internal=go.temporal.io/sdk/client"
        # The Temporal SDK re-exports these internal activity types under the
        # client package with the "Client" prefix dropped, so the blanket
        # package swap above yields undefined names (client.ClientXxx). Map each
        # explicitly to its client-package alias.
        - "go.temporal.io/sdk/internal.ClientActivityHandle=internal:go.temporal.io/sdk/client.ActivityHandle"
        - "go.temporal.io/sdk/internal.ClientCountActivitiesOptions=internal:go.temporal.io/sdk/client.CountActivitiesOptions"
        - "go.temporal.io/sdk/internal.ClientCountActivitiesResult=internal:go.temporal.io/sdk/client.CountActivitiesResult"
        - "go.temporal.io/sdk/internal.ClientGetActivityHandleOptions=internal:go.temporal.io/sdk/client.GetActivityHandleOptions"
        - "go.temporal.io/sdk/internal.ClientListActivitiesOptions=internal:go.temporal.io/sdk/client.ListActivitiesOptions"
        - "go.temporal.io/sdk/internal.ClientListActivitiesResult=internal:go.temporal.io/sdk/client.ListActivitiesResult"
        - "go.temporal.io/sdk/internal.ClientStartActivityOptions=internal:go.temporal.io/sdk/client.StartActivityOptions"
    interfaces:
      ClientConfig:
      WorkflowEngine:
      TemporalTestClient:
  github.com/vcp-vsa-control-Plane/vsa-control-plane/database/vcp:
    config:
      inpackage: True
      dir: "{{.InterfaceDir}}"
    interfaces:
      Storage:
      MigratorInterface:
      DataStore:
      Transaction:
  github.com/vcp-vsa-control-Plane/vsa-control-plane/database/vcp/readstore:
