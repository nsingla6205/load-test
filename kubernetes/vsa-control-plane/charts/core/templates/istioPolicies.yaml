{{- if .Values.istioEnabled | default true }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ontap-proxy-expert-mode
  annotations:
    kubernetes.io/description: "Authorization policy to allow ontap-proxy to access /v1/expertMode endpoints"
  labels:
    app: {{ .Chart.Name }}
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/ontap-proxy/sa/ontap-proxy-ksa"
      to:
        - operation:
            paths: ["/v1/expertMode/*"]
            methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-vsa-harvest-otel-replications
  annotations:
    kubernetes.io/description: "Authorization policy to allow vsa-harvest-otel to access /v1/getMultipleReplicationsByExternalUUID endpoint"
  labels:
    app: {{ .Chart.Name }}
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/vcp/sa/gcnv-harvest-sa"
      to:
        - operation:
            paths: ["/v1/getMultipleReplicationsByExternalUUID"]
            methods: ["GET"]
{{- if .Values.cvnInfraIstioAuth.serviceAccountPrincipal }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-cvn-infra-endpoints
  annotations:
    kubernetes.io/description: "Authorization policy to allow CVN to access core /v1 infra parity endpoints via Istio mTLS"
  labels:
    app: {{ .Chart.Name }}
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  rules:
    - from:
        - source:
            principals:
              - {{ .Values.cvnInfraIstioAuth.serviceAccountPrincipal | quote }}
      to:
        - operation:
            paths:
              - "/version"
              - "/v1/iprange"
              - "/v1/iprange/*"
              - "/v1/svm"
              - "/v1/svm/*"
              - "/v1/host"
              - "/v1/host/*"
              - "/v1/account"
              - "/v1/account/*"
              - "/v1/region"
              - "/v1/zone"
              - "/v1/cluster"
              - "/v1/volumeJobByNetwork"
              - "/v1/addressRange"
              - "/v1/addressRange/*"
            methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
{{- end }}
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: core-peer-authentication
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  mtls:
    mode: PERMISSIVE
{{- end }}