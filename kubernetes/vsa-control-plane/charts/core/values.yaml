      us-west4: "42"

environment: gcp
enabled: true
enableDbMigration: true
enableIamLifecycle: false
ttlSecondsAfterFinished: 3600
msiEnabled: false
msiUser: db-msi-user
serviceAccountName: vcp-core
deployerServiceAccountName: vcp-core
metricsEnabled: false
# Database connection retry configuration for migration tool
dbConnectRetryAttempts: 10
dbConnectRetryBaseDelayMs: 500
dbConnectRetryMaxDelayMs: 30000
replicaCount: 1
enableBackgroundTasks: true
refreshHarvestOnUpgrade: false
enableJSwapVersionCheck: true
requiredTakeoverReasons:
  - "disabled"
  - "Storage failover mailbox disks are in a degraded state"
  - "Local node has encountered errors while reading the storage failover partner's mailbox disks"
  - "Storage failover interconnect error"
  - "Partner node halted after disabling takeover"
  - "Mailbox disks are not healthy"
  - "Local node missing partner disks"
  - "Default"
jobPollingMaxDuration: 25 # seconds
jobPollingInterval: 3 # seconds
caName: "vsa-intermediate-us-e4"
caPoolName: "us-e4-vsa-npd-pool"
caPoolDeployedProjectId: "163019662857"
vsaDeployedDnsName: "us-e4.vsa"
vsaManagedZone: "us-e4-vsa"
vsaSecretCacheCleanupIntervalHours: "24"
vsaSecretAuthCacheExpirationHours: 24
privateKeyBits: 4096
secretManagerProjectId: ""

images:
  core:
    name: core
    tag: 0.0.0
    digest: ""
    secondary: true
    pullPolicy: IfNotPresent
  vcpDbMigrate:
    name: vcp-db-migrate
    tag: 0.0.0
    digest: ""
    secondary: true
    pullPolicy: IfNotPresent
  vcpIamLifecycle:
    name: vcp-iam-lifecycle
    tag: 0.0.0
    digest: ""
    secondary: true
    pullPolicy: IfNotPresent
  telemetryDeployer:
    name: vcp-cloudrun-deployer
    tag: 0.0.0
    digest: ""
    secondary: true
    pullPolicy: IfNotPresent
  telemetry:
    name: telemetry
    tag: 0.0.0
    digest: ""
    secondary: true
    pullPolicy: IfNotPresent
  otel:
    name: vcp-open-telemetry-images/opentelemetry-collector-contrib
    tag: 0.118.0
    digest: 'sha256:83ff24727f615c39056d954dd3a5d4ef227a5a9fe2c234a4489199e4351f0ab5'
    secondary: true
    pullPolicy: IfNotPresent

# Add values here in overrideCoreConfig to override the common configuration
overrideCoreConfig: {}

service:
  type: ClusterIP
  appPort: 8081

# Cloud SQL configuration for IAM authentication
# Required when global.workloadIdentityEnabled is true
cloudSql:
  # Format: PROJECT_ID:REGION:INSTANCE_NAME
  # Example: "netapp-au-se1-autopush-sde-tst:australia-southeast1:netapp-au-se1-autopush-sde-tst-db-postgres"
  instanceConnectionName: "netapp-au-se1-autopush-sde-tst:australia-southeast1:netapp-au-se1-autopush-sde-tst-db-postgres"

database:
  host: postgres-service
  hostIP: ""
  # Password-mode default DB user. When global.cloudSqlIamAuthEnabled=true, charts override DB_USER to <serviceAccount>@<project>.iam automatically.
  user: vcp-db-user
  password: vcp-db-pass
  metricsUser: vcp-db-user
  metricsPassword: vcp-db-pass
  dbAdminUser: dbAdminUser
  dbAdminPassword: dbAdminPassword
  name: vcp
  port: 5432
  type: postgres
  sslMode: "disable"
  metricsHost: postgres-service
  metricsHostIP: ""
  metricsPort: 5432
  metricsDbName: metrics
  metricsDbMaxConns: "55"
  metricsDbMaxIdleConns: "55"

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

telemetryDeployer:
  enabled: false
  gcpProxyPort: 8090
  serviceName: telemetry-service
  image: us-docker.pkg.dev/gcnv-artifact-registry-nonprod/vcp-container-images-us/telemetry:0.0.0-DEV.15
  projectID: netapp-au-se1-autopush-sde-tst
  network: "cv-tst-au-se1-k8s-vpc"
