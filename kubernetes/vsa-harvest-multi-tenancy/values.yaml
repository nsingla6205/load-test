# Namespace is fixed to vcp (same as single-tenancy vsa-harvest-otel).
# MT pollers coexist in ns vcp as separate Deployments (not the PM2 farm).
multiTenancy:
  # When true (default), this chart deploys MT pollers. Coexists with single-tenancy
  # vsa-harvest-otel — prod runs both because clusters exist on both paths.
  # Set false only to tear down / skip MT resources without uninstalling the release.
  enabled: true

nameOverride: ""
fullnameOverride: ""

image:
  # Harvest multi-tenancy poller image used for MT E2E (tenancy Core API support).
  # Keep the default on the Artifact Registry mirror used by vsa-harvest-otel;
  # GKE environments do not have credentials for this private ghcr.io image.
  repository: us-docker.pkg.dev/gcnv-artifact-registry-nonprod/vcp-container-images-us/harvest-multi
  tag: "26.08.14-1"
  digest: "sha256:6398640c27433e685f3cc5f27b364d9403afae325e7c45b260bd2d036c397a89"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 12990

serviceAccount:
  create: true
  # Stable name for Istio AuthorizationPolicy principals.
  # Sidecar OTel shares this K8s SA / WI binding: GCP SA needs ServiceControl +
  # Core API access and Monitoring Metric Writer on customer tenant projects.
  name: "harvest-multi-tenancy"
  # Same default GSA as kubernetes/vsa-harvest-otel/values.yaml. Regional
  # overrides must replace this with the local vsa-harvest-otel GSA
  # (us-c1: otel-collector-sa@netapp-us-c1-autopush-sde-tst.iam.gserviceaccount.com).
  # Used for both Workload Identity and GCP_AUTH_SERVICE_ACCOUNT.
  gcpServiceAccount: otel-collector-sa@netapp-au-se1-autopush-sde-tst.iam.gserviceaccount.com
  annotations: {}

# In-chart OTel sidecar (tenant-only). No changes required in ontap-open-telemetry.
# Scrapes the co-located poller on localhost and routes each sample to
# gcp.project.id derived from Harvest's tenant_project label.
otel:
  enabled: true
  configMap:
    create: true
  image:
    repository: us-docker.pkg.dev/gcnv-artifact-registry-nonprod/vcp-open-telemetry-images/opentelemetry-collector-contrib
    tag: "0.118.0"
    pullPolicy: IfNotPresent
  # Optional fallback; per-sample destination is tenant_project → gcp.project.id.
  # Leave empty to let the exporter resolve the project from pod credentials.
  project: ""
  logLevel: "basic"
  scrapeInterval: 300s
  healthCheckPort: 20001
  sendingQueueEnabled: true
  command:
    name: otelcol-contrib
    extraArgs: []
  # Align with single-tenancy vsa-harvest-otel prometheus/tenant keep list.
  # Expand when admitting additional tenant-project series (e.g. pool_*).
  tenantMetricRegex: "volume_space_logical_used|volume_capacity|snapmirror_total_transfer_bytes|volume_read_latency|volume_write_latency|volume_other_latency|volume_read_data|volume_write_data|volume_other_data|wafl_volume_client_protocol_reads|wafl_volume_cloud_bin_operation_size|pool_client_protocol_reads|pool_cloud_bin_operation_size|pool_client_protocol_reads_raw|pool_cloud_bin_operation_size_raw|wafl_volume_client_protocol_reads_raw|wafl_volume_cloud_bin_operation_size_raw|pool_capacity_tier_logical_footprint"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Same External Secrets pattern as gcnv-harvest: each cluster secret must
# contain pvt_ip, username, and password.
externalSecrets:
  apiVersion: external-secrets.io/v1beta1
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: main-cluster-secret-store

coreAPI:
  # Same Core Service as kubernetes/vsa-harvest-otel harvestConfig.coreApi*.
  baseURL: core-service.vcp.svc.cluster.local
  port: "8080"
  batchSize: 1000
  environment: gcp
  refreshInterval: 5m
  # JWT audience validated by Core API. Keep this equal to Core's
  # GCP_SERVICE_URL and vsa-harvest-otel harvestConfig.gcpServiceUrl.
  gcpServiceURL: https://cloudvolumesgcp-api.netapp.com

serviceControl:
  url: https://servicecontrol.googleapis.com
  serviceName: autopush-netapp.sandbox.googleapis.com

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

# Match vsa-harvest-otel: wait for Istio before Harvest dials ONTAP.
podAnnotations:
  proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
  traffic.sidecar.istio.io/excludeOutboundIPRanges: 169.254.169.254/32
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# MT-only inventory (same shape as gcnv-harvest overrides, but a separate list).
# Do not copy gcnv-harvest stamp inventory here.
#
# name: lowercased for --poller, TENANCY_CLUSTER_NAME (VCP getAllVolumeTenancy),
#       and Service DNS harvest-poller-<name>. OTel sidecar scrapes localhost.
# datacenter: Harvest location label.
# addr: optional documentation only; live address comes from secret pvt_ip.
# secret: Secret Manager key (may differ from name).
inventory:
  clusters: []
#  - name: example-mt-cluster
#    datacenter: us-oma
#    addr: 192.168.0.10
#    secret: EXAMPLE-MT-CLUSTER-SRE-RO
