# In-chart OTel sidecar values for vsa-harvest-multi-tenancy.
# Tenant-project export only; do not dual-export to stamp monitoring projects.
#
# OTel lives in this chart (sidecar on each harvest poller pod). Do not apply
# these values to the ontap-opentelemetry-collector chart for MT.
#
# Sidecar scrapes localhost:<service.port> — no separate clusters[] list.
#
# Example (usually folded into the same overrides file as inventory):
#   helm upgrade --install vsa-harvest-mt ./kubernetes/vsa-harvest-multi-tenancy \
#     -n vcp -f ci/overrides-example.yaml

otel:
  enabled: true
  configMap:
    create: true
  # Required fallback for the googlecloud exporter; per-sample destination is
  # still tenant_project → gcp.project.id.
  project: netapp-us-c1-autopush-sde-tst
  logLevel: basic
  scrapeInterval: 300s
