# Example overrides matching gcnv-harvest cloud-deploy/harvest/overrides.yaml shape.
# OTel sidecar is in-chart (localhost scrape); no separate OTel clusters[] list.
# MT pollers deploy into ns vcp (same as Core / vsa-harvest-otel).
#
# helm upgrade --install vsa-harvest-mt ./kubernetes/vsa-harvest-multi-tenancy \
#   --namespace vcp --create-namespace \
#   -f kubernetes/vsa-harvest-multi-tenancy/ci/overrides-example.yaml

multiTenancy:
  enabled: true

serviceAccount:
  create: true
  name: harvest-multi-tenancy
  annotations:
    # iam.gke.io/gcp-service-account: harvest-mt-sa@PROJECT.iam.gserviceaccount.com

coreAPI:
  baseURL: vcp-core-api.vcp.svc.cluster.local
  port: "9001"
  batchSize: 1000
  environment: gcp
  refreshInterval: 5m

serviceControl:
  url: https://servicecontrol.googleapis.com
  serviceName: autopush-netapp.sandbox.googleapis.com

otel:
  enabled: true
  # Fallback only; samples route to tenant_project via gcp.project.id.
  project: netapp-us-c1-autopush-sde-tst

# MT-only inventory (separate from gcnv-harvest). Replace with real MT clusters.
inventory:
  clusters:
    - name: example-mt-cluster
      datacenter: us-oma
      addr: 192.168.0.10
      secret: EXAMPLE-MT-CLUSTER-SRE-RO
