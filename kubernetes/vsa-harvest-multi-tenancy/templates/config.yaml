{{- if .Values.multiTenancy.enabled }}
{{- range $cluster := .Values.inventory.clusters }}
{{- $pollerName := include "vsa-harvest-multi-tenancy.clusterName" $cluster.name }}
{{- $resourceName := printf "harvest-poller-%s" $pollerName }}
{{- $secretKey := required "inventory.clusters[].secret is required" $cluster.secret }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $resourceName }}-config
  namespace: {{ include "vsa-harvest-multi-tenancy.namespace" $ }}
  labels:
    {{- include "vsa-harvest-multi-tenancy.labels" (dict "root" $ "cluster" $cluster) | nindent 4 }}
data:
  harvest.yml: |
    Exporters:
      prometheus:
        exporter: Prometheus
        local_http_addr: 0.0.0.0
        port: {{ $.Values.service.port }}
      service_control:
        exporter: ServiceControl
        url: {{ $.Values.serviceControl.url | quote }}
        service_name: {{ $.Values.serviceControl.serviceName | quote }}
        mappings:
          volume:
            - source: capacity
              target: netapp.googleapis.com/volume/allocated_bytes
            - source: space_logical_used
              target: netapp.googleapis.com/volume/bytes_used
            - source: snapshots_size_used
              target: netapp.googleapis.com/volume/snapshot_bytes
            - source: read_ops
              target: netapp.googleapis.com/volume/operation_count
              labels: {type: read}
            - source: write_ops
              target: netapp.googleapis.com/volume/operation_count
              labels: {type: write}
            - source: other_ops
              target: netapp.googleapis.com/volume/operation_count
              labels: {type: metadata}
            - source: read_data
              target: netapp.googleapis.com/volume/throughput
              labels: {type: read}
            - source: write_data
              target: netapp.googleapis.com/volume/throughput
              labels: {type: write}
            - source: other_data
              target: netapp.googleapis.com/volume/throughput
              labels: {type: metadata}
            - source: read_latency
              target: netapp.googleapis.com/volume/average_latency
              labels: {method: read}
            - source: write_latency
              target: netapp.googleapis.com/volume/average_latency
              labels: {method: write}
            - source: other_latency
              target: netapp.googleapis.com/volume/average_latency
              labels: {method: metadata}
            - source: volume_allocated_throughput
              target: netapp.googleapis.com/volume/throughput_limit
            - source: inode_files_used
              target: netapp.googleapis.com/volume/inode_used
            - source: inode_files_total
              target: netapp.googleapis.com/volume/inode_limit
            - source: new_status_code
              target: netapp.googleapis.com/internal/volume/volume_online
          pool:
            - source: pool_capacity
              target: netapp.googleapis.com/storage_pool/capacity
            - source: capacity
              target: netapp.googleapis.com/storage_pool/allocated
    Defaults:
      collectors:
        - Rest
        - RestPerf
      use_insecure_tls: true
    Pollers:
      {{ $pollerName }}:
        datacenter: {{ required "inventory.clusters[].datacenter is required" $cluster.datacenter | quote }}
        addr: "{{ `{{ .pvt_ip }}` }}"
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
        exporters:
          - prometheus
          - service_control
---
apiVersion: {{ $.Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $resourceName }}-config
  namespace: {{ include "vsa-harvest-multi-tenancy.namespace" $ }}
  labels:
    {{- include "vsa-harvest-multi-tenancy.labels" (dict "root" $ "cluster" $cluster) | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.externalSecrets.secretStoreRef.kind }}
    name: {{ $.Values.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ $resourceName }}-config
    template:
      engineVersion: v2
      type: Opaque
      templateFrom:
        - configMap:
            name: {{ $resourceName }}-config
            items:
              - key: harvest.yml
  dataFrom:
    - extract:
        key: {{ $secretKey | quote }}
{{- end }}
{{- end }}
