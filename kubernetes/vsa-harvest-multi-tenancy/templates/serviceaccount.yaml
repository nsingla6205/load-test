{{- if and .Values.multiTenancy.enabled .Values.serviceAccount.create }}
{{- $customAnnotations := omit (.Values.serviceAccount.annotations | default dict) "iam.gke.io/gcp-service-account" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vsa-harvest-multi-tenancy.serviceAccountName" . }}
  namespace: {{ include "vsa-harvest-multi-tenancy.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "vsa-harvest-multi-tenancy.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if or .Values.serviceAccount.gcpServiceAccount $customAnnotations }}
  annotations:
    {{- with .Values.serviceAccount.gcpServiceAccount }}
    iam.gke.io/gcp-service-account: {{ . | quote }}
    {{- end }}
  {{- with $customAnnotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
