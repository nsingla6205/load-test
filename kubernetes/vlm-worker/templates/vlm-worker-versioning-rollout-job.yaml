{{- if and .Values.vlmWorkerVersioning.enabled .Values.vlmWorkerVersioning.rollout.enabled (eq (include "vlmWorkerVersioning.cutoverPending" .) "true") }}
{{- $rolloutDigest := .Values.vlmWorkerVersioning.rollout.image.digest | toString | trim }}
{{- if not .Values.global.useTags }}
{{- $rolloutDigest = required "vlmWorkerVersioning.rollout.image.digest is required when global.useTags is false" $rolloutDigest }}
{{- end }}
{{- $rolloutImage := include "containerImage" (list . (dict "vlmImageName" .Values.vlmWorkerVersioning.rollout.image.name "vlmImageTag" .Values.vlmWorkerVersioning.rollout.image.tag "vlmImageDigest" $rolloutDigest "secondary" .Values.vlmWorkerVersioning.rollout.image.secondary)) | trim }}
apiVersion: batch/v1
kind: Job
metadata:
  name: vlm-worker-versioning-ensure-drain
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # A node reboot or kubelet shutdown kills the pod before the gates finish.
  # restartPolicy stays Never; this only lets the Job schedule a replacement
  # pod within activeDeadlineSeconds instead of failing outright. The checks
  # are read-only polls, so retrying is safe.
  backoffLimit: 3
  # Two 15-minute gates: Kubernetes readiness, then Temporal Build A polling.
  activeDeadlineSeconds: 1860
  template:
    metadata:
      annotations:
        # STRICT mTLS rejects a sidecar-less client. This mesh injects istio-proxy
        # as a normal container, so the rollout binary posts /quitquitquit on exit.
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
      labels:
        app: vlm-worker-versioning-ensure-drain
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      containers:
        - name: rollout
          image: {{ $rolloutImage | quote }}
          imagePullPolicy: {{ .Values.vlmWorkerVersioning.rollout.image.pullPolicy }}
          resources:
            limits:
              cpu: {{ .Values.vlmWorkerVersioning.rollout.resources.limits.cpu }}
              memory: {{ .Values.vlmWorkerVersioning.rollout.resources.limits.memory }}
            requests:
              cpu: {{ .Values.vlmWorkerVersioning.rollout.resources.requests.cpu }}
              memory: {{ .Values.vlmWorkerVersioning.rollout.resources.requests.memory }}
          env:
            - name: MODE
              value: ensure-drain
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: ROLLOUT_SPEC
              value: {{ include "vlmWorkerVersioning.rolloutSpec" . | quote }}
            - name: TEMPORAL_HOST
              value: {{ .Values.workerConfig.temporalHost | quote }}
            - name: TEMPORAL_PORT
              value: {{ .Values.workerConfig.temporalPort | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.vlmWorkerVersioning.rollout.temporalNamespace | default "default" | quote }}
            - name: POLL_EVERY_SECONDS
              value: {{ .Values.vlmWorkerVersioning.rollout.pollEverySeconds | default 15 | quote }}
            - name: DRAIN_READY_TIMEOUT_MINUTES
              value: "15"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vlm-worker-versioning-promote-retire
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # Before reconciler (weight 5) so drain workers are not scaled by ONTAP inactivity mid-rollout.
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Same rationale as ensure-drain above: tolerate a killed pod from a node
  # reboot without failing the Helm release. Promotion and pinning are
  # idempotent (buildAlreadyCurrent / cutoverFinished skip repeated work), so
  # a replacement pod picking up mid-rollout is safe.
  backoffLimit: 3
  # This hook still waits for drain readiness (15m) and both builds to poll (10m),
  # then pins, sets Current, and starts the drain Job. 10m remains for that work.
  # Drainage itself runs in its own Job, so drainTimeoutMinutes is not included.
  activeDeadlineSeconds: 2100
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
      labels:
        app: vlm-worker-versioning-rollout
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      containers:
        - name: rollout
          image: {{ $rolloutImage | quote }}
          imagePullPolicy: {{ .Values.vlmWorkerVersioning.rollout.image.pullPolicy }}
          resources:
            limits:
              cpu: {{ .Values.vlmWorkerVersioning.rollout.resources.limits.cpu }}
              memory: {{ .Values.vlmWorkerVersioning.rollout.resources.limits.memory }}
            requests:
              cpu: {{ .Values.vlmWorkerVersioning.rollout.resources.requests.cpu }}
              memory: {{ .Values.vlmWorkerVersioning.rollout.resources.requests.memory }}
          env:
            - name: MODE
              value: promote-and-retire
            - name: ROLLOUT_IMAGE
              value: {{ $rolloutImage | quote }}
            - name: SERVICE_ACCOUNT
              value: {{ .Values.serviceAccount.name | quote }}
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: DRY_RUN
              value: {{ .Values.vlmWorkerVersioning.rollout.dryRun | quote }}
            - name: DELETE_VERSION_AFTER_DRAIN
              value: {{ .Values.vlmWorkerVersioning.rollout.deleteVersionAfterDrain | quote }}
            - name: PIN_UNVERSIONED_WORKFLOWS
              value: {{ .Values.vlmWorkerVersioning.rollout.pinUnversionedWorkflows | quote }}
            - name: ROLLOUT_SPEC
              value: {{ include "vlmWorkerVersioning.rolloutSpec" . | quote }}
            - name: TEMPORAL_HOST
              value: {{ .Values.workerConfig.temporalHost | quote }}
            - name: TEMPORAL_PORT
              value: {{ .Values.workerConfig.temporalPort | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.vlmWorkerVersioning.rollout.temporalNamespace | default "default" | quote }}
            - name: POLL_EVERY_SECONDS
              value: {{ .Values.vlmWorkerVersioning.rollout.pollEverySeconds | default 15 | quote }}
            - name: DRAIN_READY_TIMEOUT_MINUTES
              value: "15"
            - name: DRAIN_TIMEOUT_MINUTES
              value: {{ .Values.vlmWorkerVersioning.rollout.drainTimeoutMinutes | default 360 | quote }}
{{- end }}
