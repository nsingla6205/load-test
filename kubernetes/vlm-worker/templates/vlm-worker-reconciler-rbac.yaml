{{- $rolloutEnabled := and .Values.vlmWorkerVersioning.enabled .Values.vlmWorkerVersioning.rollout.enabled }}
{{- if or .Values.vlmWorkerReconciler.enabled $rolloutEnabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vlm-worker-reconciler-role
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs:
      - get
      - list
      {{- if $rolloutEnabled }}
      - create
      - patch
      {{- end }}
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["patch"]
  {{- if $rolloutEnabled }}
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vlm-worker-reconciler-rolebinding
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vlm-worker-reconciler-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
