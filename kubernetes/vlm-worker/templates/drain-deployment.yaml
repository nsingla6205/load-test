{{- /*
  Drain Deployments for D-patch Build A pollers.
  These are normal release resources. The pre-upgrade hook must not create them:
  Helm 3 fails the upgrade when the object already exists but the previous release
  does not list the name.
  Replicas come from the live Deployment when one exists, so a finished cutover
  that scaled this Deployment to 0 stays at 0. A missing Deployment uses app.replicas.
  Leave drainingBuilds set after success. Removing an entry drops this Deployment
  from the release. Helm then deletes it, and Kubernetes deletes its pods.
  A failed scale-to-0 does not orphan pods: the Deployment stays in the release,
  the pair is not recorded, and the next upgrade runs the Job again.
*/ -}}
{{- if $.Values.vlmWorkerVersioning.enabled }}
{{- range $mapping := $.Values.ontapVersionVlmImageMappings }}
  {{- $versionName := (regexFind `(?i)\d+\.\d+\.\d+(?:p\d+(?:x\d+)?|x\d+)?` $mapping.ontapVersion) }}
  {{- $version := ($versionName | lower | replace "." "-") }}
  {{- if $mapping.drainingBuilds }}
  {{- range $drain := $mapping.drainingBuilds }}
    {{- $drainBuild := (default "" $drain.buildId) | toString | trim }}
    {{- if $drainBuild }}
    {{- $drainSuffix := printf "%s-drain-%s" $version $drainBuild }}
    {{- $drainName := printf "%s-%s" $.Values.app.name $drainSuffix }}
    {{- $liveDrain := lookup "apps/v1" "Deployment" $.Release.Namespace $drainName }}
    {{- $drainReplicas := $.Values.app.replicas }}
    {{- if and $liveDrain $liveDrain.spec (hasKey $liveDrain.spec "replicas") }}
    {{- $drainReplicas = $liveDrain.spec.replicas }}
    {{- end }}
    {{- $drainImageName := default $mapping.vlmImageName $drain.vlmImageName }}
    {{- $drainImageTag := default $mapping.vlmImageTag $drain.vlmImageTag }}
    {{- $drainDigest := default "" $drain.vlmImageDigest | toString | trim }}
    {{- if not $.Values.global.useTags }}
    {{- $drainDigest = required (printf "drainingBuilds[%s].vlmImageDigest is required when global.useTags is false" $drainBuild) $drainDigest }}
    {{- end }}
    {{- $drainSecondary := default $mapping.secondary $drain.secondary }}
    {{- $drainPull := default $mapping.pullPolicy $drain.pullPolicy }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $drainName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $drainName }}
    vlm.netapp.io/role: drain
    vlm-ontap-version: {{ $versionName | quote }}
    vlm-build-id: {{ $drainBuild | quote }}
spec:
  replicas: {{ $drainReplicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ $drainName }}
  template:
    metadata:
      labels:
        app: {{ $drainName }}
        vlm.netapp.io/role: drain
        vlm-ontap-version: {{ $versionName | quote }}
        vlm-build-id: {{ $drainBuild | quote }}
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      containers:
        - name: {{ $drainName }}
          {{- if $drainSecondary }}
          image: "{{- include "containerImage" (list $ (dict "secondary" true "vlmImageName" $drainImageName "vlmImageTag" $drainImageTag "vlmImageDigest" $drainDigest )) | trim -}}"
          {{- else }}
          image: "{{- include "containerImage" (list $ (dict "secondary" false "vlmImageName" $drainImageName "vlmImageTag" $drainImageTag "vlmImageDigest" $drainDigest )) | trim -}}"
          {{- end }}
          imagePullPolicy: {{ $drainPull }}
          resources:
            limits:
              cpu: {{ $.Values.resources.limits.cpu }}
              memory: {{ $.Values.resources.limits.memory }}
            requests:
              cpu: {{ $.Values.resources.requests.cpu }}
              memory: {{ $.Values.resources.requests.memory }}
          envFrom:
            - configMapRef:
                name: {{ include "vlm-worker.configMapName" (list $ $drainSuffix) }}
            - secretRef:
                name: {{ include "vlm-worker.secretName" $ }}
---
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
