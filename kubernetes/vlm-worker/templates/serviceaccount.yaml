apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- range $key, $value := .Values.serviceAccount.annotations }}
    {{ $key | quote }}: {{ $value | quote }}
    {{- end }}
    # Older releases stored this account as a hook, not a release resource.
    # keep stops a rollback to those releases from deleting it.
    "helm.sh/resource-policy": keep
{{- if .Values.imagePullSecrets }}
imagePullSecrets:
  {{- range .Values.imagePullSecrets }}
  {{- if . }}
  - name: {{ .name | quote }}
  {{- end}}
  {{- end }}
{{- end }}

