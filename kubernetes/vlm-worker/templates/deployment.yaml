{{- /*
  Primary VLM worker Deployments (one per ONTAP mapping).
  When vlmWorkerVersioning.enabled and mapping.buildId is set, pods advertise that Build ID.
*/ -}}
{{- range $mapping := $.Values.ontapVersionVlmImageMappings }}
    {{- $versionName := (regexFind `(?i)\d+\.\d+\.\d+(?:p\d+(?:x\d+)?|x\d+)?` $mapping.ontapVersion) }}
    {{- $version := ($versionName | lower | replace "." "-") }}
    {{- $buildId := (default "" $mapping.buildId) | toString | trim }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Values.app.name }}-{{ $version }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Values.app.name }}-{{ $version }}
    vlm.netapp.io/role: primary
    vlm-ontap-version: {{ $versionName | quote }}
    {{- if $buildId }}
    vlm-build-id: {{ $buildId | quote }}
    {{- end }}
spec:
  replicas: {{ $.Values.app.replicas }}
  {{- if $.Values.vlmWorkerVersioning.enabled }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      app: {{ $.Values.app.name }}-{{ $version }}
  template:
    metadata:
      labels:
        app: {{ $.Values.app.name }}-{{ $version }}
        vlm.netapp.io/role: primary
        vlm-ontap-version: {{ $versionName | quote }}
        {{- if $buildId }}
        vlm-build-id: {{ $buildId | quote }}
        {{- end }}
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      {{- with $.Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $.Values.podAffinity.enabled (eq $.Values.global.environment "gcp") }}
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 3
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: {{ $.Values.app.name }}-{{ $version }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: {{ $.Values.app.name }}-{{ $version }}
      {{- end }}
      containers:
        - name: {{ $.Values.app.name }}-{{ $version }}
          {{- if $mapping.secondary }}
          image: "{{- include "containerImage" (list $ (dict "secondary" true "vlmImageName" $mapping.vlmImageName "vlmImageTag" $mapping.vlmImageTag "vlmImageDigest" $mapping.vlmImageDigest )) | trim -}}"
          {{- else }}
          image: "{{- include "containerImage" (list $ (dict "secondary" false "vlmImageName" $mapping.vlmImageName "vlmImageTag" $mapping.vlmImageTag "vlmImageDigest" $mapping.vlmImageDigest )) | trim -}}"
          {{- end }}
          imagePullPolicy: {{ $mapping.pullPolicy }}
          resources:
            limits:
              cpu: {{ $.Values.resources.limits.cpu }}
              memory: {{ $.Values.resources.limits.memory }}
            requests:
              cpu: {{ $.Values.resources.requests.cpu }}
              memory: {{ $.Values.resources.requests.memory }}
          envFrom:
            - configMapRef:
                name: {{ include "vlm-worker.configMapName" (list $ $version) }}
            - secretRef:
                name: {{ include "vlm-worker.secretName" $ }}
---
{{- end }}
