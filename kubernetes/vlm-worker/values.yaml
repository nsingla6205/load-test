global:
  primaryImageRegistry: ghcr.io
  primaryImageRegistryPath: vcp-vsa-control-plane
  primaryImageRegistryPasswordAuth: true
  primaryImagePullSecretName: ghcr.io
  secondaryImageRegistry: "us-docker.pkg.dev/gcnv-artifact-registry-nonprod"
  secondaryImageRegistryPath: "vcp-container-images-us"
  secondaryImageRegistryPasswordAuth: false
  useTags: false
  chartPrimaryImageRegistry: ""
  chartSecondaryImageRegistry: ""
  environment: gcp
  # Cloud SQL IAM Authentication via Workload Identity
  # When enabled: Uses IAM authentication with Cloud SQL Proxy sidecar
  # When disabled: Uses traditional username/password authentication
  cloudSqlIamAuthEnabled: false
  # Central Cloud SQL Proxy image used when IAM DB auth is enabled.
  # Pinned by digest to prevent supply-chain substitution attacks via tag re-push.
  cloudSqlProxy:
    image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy@sha256:f6abce8d90076c0857f23fb2cffb744024f380eca25334e9f2b52d2d74dc9967"

cloudSql:
  # Format: PROJECT_ID:REGION:INSTANCE_NAME
  # Required when global.cloudSqlIamAuthEnabled=true
  instanceConnectionName: ""
  # Exact IAM DB user email (e.g. "vcp-worker-ksa@<project>.iam").
  # Required when global.cloudSqlIamAuthEnabled=true; set in the deployment repo.
  iamDbUser: ""

# Application configuration
app:
  name: "vlm-worker"
  replicas: 1

serviceAccount:
  name: "vlm-worker-ksa"

resources:
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: "1"
    memory: 2Gi

# Ontap Version mapping with VLM. To support more ontap versions, similar block needs to be added below.
# We should support previous versions as well, for backward compatibility.
ontapVersionVlmImageMappings:
    # VLM worker to support ONTAP patch version 9.17.1P2
  - ontapVersion: "9.17.1P2"
    vlmImageName: "vlm-worker"
    vlmImageTag: "R9.17.1x_7882520"
    vlmImageDigest: "sha256:0b0a7f4063ba4e848af6f5d43c120c830ab1bcadf4f13e11710a3f15f066bf27"
    # Set by the D-patch pipeline when vlmWorkerVersioning.enabled. Empty = not a D-patch.
    # buildId is the new VLM image tag suffix (e.g. R9.18.1x_8141647 → "8141647").
    # drainingBuilds is the previous build for that cutover. The chart renders that
    # drain ConfigMap and Deployment. The pre-upgrade hook does not create them:
    # Helm fails the first upgrade if the hook creates a name the previous release
    # does not list. After the new build is Current and the old build is drained,
    # later upgrades leave the cutover alone. After the Job records the finished
    # pair, the chart omits the hook Jobs. The drain Deployment keeps its live
    # replica count, so a finished drain stays at 0. e.g.:
    #   drainingBuilds:
    #     - buildId: "8083481"
    #       vlmImageDigest: "sha256:35ed962d3209593086b29403dc158e36d3a84bc21eecd8c835ee2b6a17e37f02"
    #       vlmImageName: "vlm-worker"    # optional; defaults to this mapping
    #       vlmImageTag: "R9.18.1x_8083481" # optional; defaults to this mapping
    #       secondary: true                 # optional
    #       pullPolicy: IfNotPresent        # optional
    buildId: ""
    drainingBuilds: []
    secondary: true
    pullPolicy: IfNotPresent
  # VLM worker to support ONTAP patch version 9.17.1P1
  - ontapVersion: "9.17.1P1"
    vlmImageName: "vlm-worker"
    vlmImageTag: "R9.17.1x_7855269"
    vlmImageDigest: "sha256:07d042905f40dfc4c566919ebc539b617d9a1fc38773ab9a26e7749fd85c8405"
    secondary: true
    pullPolicy: IfNotPresent
    # VLM worker to support ONTAP test patch versions like 9.17.1X50 or any other test patch version
  - ontapVersion: "9.17.1"
    vlmImageName: "vlm-worker"
    vlmImageTag: "R9.17.1x_7882520"
    vlmImageDigest: "sha256:0b0a7f4063ba4e848af6f5d43c120c830ab1bcadf4f13e11710a3f15f066bf27"
    secondary: true
    pullPolicy: IfNotPresent
  - ontapVersion: "9.18.1"
    vlmImageName: "vlm-worker"
    vlmImageTag: "R9.18.1x_7984401"
    vlmImageDigest: "sha256:5e3ec2191da5bfa53029acfb483c61365f74373d5dbe811f6cc9c0fe88f8ba0b"
    secondary: true
    pullPolicy: IfNotPresent
  - ontapVersion: "9.18.1P1"
    vlmImageName: "vlm-worker"
    vlmImageTag: "R9.18.1Px_8028694"
    vlmImageDigest: "sha256:b43b5ae0d471ab668458070235d8a021b9e5cc5cbca7f8274bade66f88a49201"
    secondary: true
    pullPolicy: IfNotPresent
  - ontapVersion: "9.18.1P2"
    vlmImageName: "vlm-worker"
    vlmImageTag: "R9.18.1x_8083481"
    vlmImageDigest: "sha256:35ed962d3209593086b29403dc158e36d3a84bc21eecd8c835ee2b6a17e37f02"
    secondary: true
    pullPolicy: IfNotPresent
  - ontapVersion: "9.18.1P3"
    vlmImageName: "vlm-worker"
    vlmImageTag: "R9.18.1x_8141647"
    vlmImageDigest: "sha256:2fdeb9e5828a74e047313178300fc6f8eb11a1a710bf04efa3115eb70daa860c"
    secondary: true
    pullPolicy: IfNotPresent
  - ontapVersion: "9.19.1x36"
    vlmImageName: "vlm-worker"
    vlmImageTag: "R9.19.1x_8169569"
    vlmImageDigest: "sha256:45f0119e707e28a5c87551cdb908884511c27171cfe991570218ceaa438ad0d8"
    secondary: true
    pullPolicy: IfNotPresent
  - ontapVersion: "9.19.1"
    vlmImageName: "vlm-worker"
    vlmImageTag: "R9.19.1x_8201956"
    vlmImageDigest: "sha256:69f53f22a49dd354414ba461e77fd0abff1afb0d5417784cd60b348ec246aab2"
    secondary: true
    pullPolicy: IfNotPresent
  - ontapVersion: "9.19.1P2"
    vlmImageName: "vlm-worker"
    vlmImageTag: "R9.19.1Px_8314229"
    vlmImageDigest: "sha256:fd7d37961fd0c62c96ec2b250fe8f17f2a3ea1549c67dc228cc72b0b285da450"
    buildId: "8314229"
    drainingBuilds:
      - buildId: "8258295"
        vlmImageName: "vlm-worker"
        vlmImageTag: "R9.19.1Px_8258295"
        vlmImageDigest: "sha256:624af541e3e6a09c5b202c7f7e089d34543ec8e67998ac964b3d9728a1a11e30"
        secondary: true
        pullPolicy: IfNotPresent
    secondary: true
    pullPolicy: IfNotPresent

podAnnotations: {}

initContainers: []

# Worker configuration
workerConfig:
  provider: "gcp"
  temporalHost: "temporal-frontend.temporal.svc.cluster.local"
  temporalPort: "7233"
  taskQueuePrefix: "vsa-lifecycle-manager"
  debug: "false"
  maxConcurrentActivities: "300"
  maxConcurrentWorkflows: "200"
  maxConcurrentWorkflowTaskPollers: "3"
  maxConcurrentActivityTaskPollers: "6"
  # Encryption key must be a 32-byte (256-bit) string for AES-256.
  vsaVlmEncryptionKey: "" # Should be the same as in the vcp-worker values.yaml.
  gceMetadataHost: ""
  # When "true", VLM may reuse singleton GCP API clients; access tokens expire (~30–60m) and
  # Compute calls can fail with ACCESS_TOKEN_EXPIRED until pods restart. Prefer "false" so
  # credentials refresh for long-running workers (see vlm-worker ConfigMap ENABLE_GLOBAL_GCP_CLIENTS).
  enableGlobalGcpClients: "true"
  useVmReservations: "true"

# Temporal Worker Versioning for VLM D-patches (GCP).
# See doc/architecture/designs/0032-vlm-dpatch-temporal-worker-versioning.md
vlmWorkerVersioning:
  enabled: true
  # Optional override; empty → sanitized TASK_QUEUE (dots → hyphens).
  temporalWorkerDeploymentName: ""
  rollout:
    enabled: true
    # Only skips the post-upgrade promote/retire actions. The pre-upgrade
    # ensure-drain gate still waits when the drain Deployment already exists.
    dryRun: false
    # When false, the rollout promotes the new build directly.
    # When true, it first pins running unversioned workflows to the draining build.
    pinUnversionedWorkflows: true
    deleteVersionAfterDrain: false
    pollEverySeconds: 15
    drainTimeoutMinutes: 360
    temporalNamespace: "default"
    image:
      name: "vlm-worker-versioning-rollout"
      tag: "vscp-7593-review-28e30ee"
      # Required when global.useTags is false (images resolve by digest).
      digest: "sha256:e10abd5ea2efc54d9579575e66e8a62b153d5a68d58e9de44d5c41d0ea667858"
      secondary: true
      pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: "500m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"

#Enabling or Disabling Secret Manager for Microservice Secrets
secretManagerEnabled: false

# Pod affinity configuration
podAffinity:
  enabled: true

# VLM Worker Reconciler — post-upgrade/post-install hook Job that scales inactive
# vlm-worker Deployments to 0 based on active ONTAP versions in the VCP database.
vlmWorkerReconciler:
  # Master feature flag. Set to true in staging before enabling in production.
  enabled: false
  # When true the Job logs intended scale actions but makes no changes to replicas.
  # Enable first in each environment to validate logic before going live.
  dryRun: true

  image:
    name: "vlm-worker-reconciler"
    tag: "v1.4.7"
    digest: "sha256:dc8c53033ee589581945e7023b79510c6ca2216d5e4617433bc2e73a589fb642"
    # secondary: true — image lives in the secondary (GAR) registry, not ghcr.io
    secondary: true
    pullPolicy: IfNotPresent

  database:
    host: ""
    port: "5432"
    name: "vcp"
    user: ""
    password: ""
    sslMode: "disable"
    secretName: "vlm-worker-reconciler-db-secret"

  externalSecrets:
    dbUsername:
      secretName: ""
      property: ""
    dbPassword:
      secretName: ""
      property: ""

  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

  # GCP project ID for Cloud Monitoring metric emission.
  # Leave empty to disable metrics (e.g. in local dev or if Workload Identity is not configured).
  gcpProjectId: ""

  cloudSqlProxy:
    # Admin port for the --quitquitquit endpoint used to cleanly shut the sidecar down.
    # Must match --admin-port in the proxy args in _helpers.tpl.
    adminPort: 9091

  # Maximum time the Job is allowed to run before Kubernetes terminates it.
  activeDeadlineSeconds: 300
  # No retries — a failed reconcile leaves workers at replicas=1 (safe default).
  # The next helm upgrade will trigger a fresh attempt.
  backoffLimit: 0
