global:
  primaryImageRegistry: iad.ocir.io
  primaryImageRegistryPath: "idqogasfjw45"
  primaryImageRegistryPasswordAuth: true
  primaryImagePullSecretName: ocir-secret
  secondaryImageRegistry: "iad.ocir.io"
  secondaryImageRegistryPath: "nmobsa"
  secondaryImageRegistryPasswordAuth: false
  useSecondaryImageRegistry: false
  useTags: true
  chartPrimaryImageRegistry: ""
  chartSecondaryImageRegistry: ""
  environment: oci
  # HYPERSCALER env var for worker (utils/env.GetHyperscaler()). Use "oci" for OCI.
  hyperscaler: oci

# Application configuration (single customer worker for OCI/OKE)
app:
  - name: "vcp-customer-worker"
    replicas: 1
    workerAdditionalConfig:
      workerTaskQueue: "customer-workflows"

serviceAccount:
  name: "vcp-worker-ksa"

# Pod affinity configuration
podAffinity:
  enabled: true

# Image configuration (OCIR)
images:
  vcpWorker:
    image: ""  # Use name+tag with registry helpers (supports primary/secondary switch)
    name: vcp-worker
    tag: "23032026"
    digest: ""
    secondary: false
    pullPolicy: IfNotPresent

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 250Mi

# Worker configuration (OCI/OKE)
workerConfig:
  temporalAddress: "temporal-frontend.temporal.svc.cluster.local:7233"
  localRegion: "us-ashburn-1"
  objectStoreProvider: "oci"
  vlmWorkflowRetryMaxAttempts: "1"
  # Worker concurrency caps and rate limits.
  # 0 = SDK default (1000 for concurrency caps, unlimited for rate limits).
  customerWorkerMaxConcurrentActivityExecution: "0"
  customerWorkerMaxConcurrentWorkflowTaskExecution: "0"
  customerWorkerMaxConcurrentLocalActivityExecution: "0"
  customerWorkerActivitiesPerSecond: "0"
  customerWorkerTaskQueueActivitiesPerSecond: "0"
  backgroundWorkerMaxConcurrentActivityExecution: "0"
  backgroundWorkerMaxConcurrentWorkflowTaskExecution: "0"
  backgroundWorkerMaxConcurrentLocalActivityExecution: "0"
  backgroundWorkerActivitiesPerSecond: "0"
  backgroundWorkerTaskQueueActivitiesPerSecond: "0"
  vsaOperationTimeout: "45m"
  loggerLevel: "info"
  vlmConfigFilePath: "/common/vsa_config/vlm-config.json"
  vmrsConfigPath: "/config/vmrs_oci.yaml"
  certificateLifetime: "94608000s"
  caName: ""
  enableVsaCertificateRotation: "false"
  enableVsaExpiredCertificatesRotation: "false"
  # Gates the OCI VSA certificate-rotation workflow (self-gate inside RotateOciVsaCertificateWorkflow).
  # The matching Temporal Schedule is created by oci-proxy (see oci-proxy chart).
  enableOciVsaCertificateRotation: "false"
  # Cron cadence for the oci certificaterotation schedule. Default is daily at midnight UTC.
  ociCertificateRotationCronExpression: "0 0 * * *"

  vsaLifecycleManagerQueuePrefix: "vsa-lifecycle-manager"
  # Encryption key must be a 32-byte (256-bit) string for AES-256.
  vsaVlmEncryptionKey: "" # Should be the same as in the vlm-worker values.yaml.
  # Comma-separated list of error patterns that trigger delete and retry operations
  vlmRetryErrorPatterns: ""
  # Minimum HA pairs that trigger the large-capacity VLM cluster-deploy timeout.
  numberOfHaPairsLargeCapacity: 6
  # VLM CreateVSAClusterDeployment workflow timeout (minutes) for large-capacity pools.
  vlmCreateVsaClusterDeploymentWfTimeoutMinutesLv: 120
  ontapVersionDetails: "9.19.1P1X7"
  localCell: "00"
  ociVSASerialAllocationEnabled: true

  ociVsaUseSecondaryIpsForLifs: true
  # Assign a public IP to each VSA node management LIF (off by default).
  ociVsaExtIpForNodeMgmt: false
  # When true, skip VSA cleanup if VLM deployment fails (useful for debugging).
  disableVsaCleanupOnVlmFailure: false

  # ONTAP Image Version Match Configuration
  skipOntapImageVersionMatch: false

  # Mediator VM Configuration
  vsaMediatorInstanceType: "VM.Standard.E5.Flex"
  ociCreator: "vcp"
  ociVsaFlexOcpus: 8
  ociVsaFlexMemoryInGBs: 96
  ociVsaUserBootargs: ""
  ociVsaSharedHaDataDiskCount: 13
  ociVsaNonSharedHaDataDiskCount: 10
  ociVmrsEnabled: false
  ociMediatorInstanceType: "VM.Standard3.Flex"
  vsaMediatorImageName: "ocid1.image.oc1.iad.aaaaaaaa7jahxa2up4364shyrd6x3tv3ijmip2umefrvoh754k3lorhmchva"
  vsaImageName: "ocid1.image.oc1.iad.aaaaaaaacuiqqytcgvbax2q2lmbhawhtilz2xgxn5vjthw5fxmkkesbgkk3a"
  secretUri: "ocid1.vaultsecret.oc1.iad.amaaaaaarxzkjlqajgrscsxpkbduu4rcocmwi4wh57okquxkqibzwl6vyjxa"
  ociResourcePrincipalRegion: "us-ashburn-1"
  ociResourcePrincipalVersion: "2.2"
  ociExpertModePassword: ""
  enableAdminTempPassword: false
  ociExpertModeRbacFileUrl: ""
  ociExpertModeRbacFileChecksum: ""
  ociExpertModeUsername: "ociadmin"
  ociVaultOcid: ""
  ociMasterKeyOcid: ""
  ociVaultCompartmentOcid: ""
  ociCertCompartmentOcid: ""
  ociIssuerCaOcid: ""
  ociClientIssuerCaOcid: ""
  ociSeparateMtlsClientCert: true
  ociServiceIssuerCaOcid: ""
  ociServiceOntapCertEnabled: false
  vsaDeployedDnsName: ""
  ociVsaDnsZoneOcid: ""
  ociUseTlsSniOverride: true
  # OCI cloud proxy (FSN resource manager): enabled by default for in-cluster deployments.
  # Routes OCI mutations through the proxy REST API instead of the OCI Go SDK.
  # Set ociProxyBaseUrl to "" in an environment override to use the OCI Go SDK.
  # PAR URLs require OCI auth region == Object Storage bucket region (no host override).
  ociProxyBaseUrl: "http://resource-manager-service.fsn.svc.cluster.local"
  # Required when ociProxyBaseUrl uses http:// (in-cluster service; not for external https endpoints).
  ociProxyAllowHttp: true
  # PEM file paths for proxy TLS (mount secrets at these paths when using private CA or mTLS).
  ociProxyCaBundle: ""
  ociProxyClientCert: ""
  ociProxyClientKey: ""
  # Dry-run mode: sends x-proxy-validate-only on proxied requests.
  ociProxyValidateOnly: false
  # Per-request HTTP timeout (seconds) for the OCI cloud proxy client.
  ociProxyHttpTimeoutSec: 60
  # Optional: override OCI API version path roots (defaults match oci-cloud-proxy-api.yaml).
  ociProxyAPIVersionPrefix: ""
  ociProxySecretBundlesAPIVersionPrefix: "/20190301/secretbundles"
  ociProxyVaultAPIVersionPrefix: "/20180608"
  ociProxyCertificatesAPIVersionPrefix: "/20210224"
  ociProxyDNSAPIVersionPrefix: "/20180115"
  ociVsaMinPerDiskSizeGi: 50
  ociVsaAllowNonDenseShapeForVsa: true
  ociDefinedTagNamespace: "netapp_tags"
  # Validity window (in days) for internally-managed OCI certificates issued for
  # VSA clusters.
  ociCertificateValidityDays: "90"
  # OCI certificate/secret rotation tuning (worker-side). Defaults mirror utils/env/env.go.
  # % of the active certificate version's lifetime elapsed before rotation triggers.
  ociCertificateRotationThresholdPercentage: "75"
  # Comma-separated pool states eligible for OCI certificate/password rotation.
  ociCertificateRotationPoolStates: "READY,DEGRADED"
  # Number of pools fetched per list call when the dispatcher fans out rotation.
  ociCertificateRotationBatchSize: "10"
  # Bounds each per-pool rotation workflow run (Temporal WorkflowRunTimeout), in minutes.
  ociCertificateRotationChildWorkflowTimeoutMinutes: "15"
  # Days after scheduling deletion before the old OCI certificate is permanently removed (OCI min: 1, max: 29).
  ociCertificateDeletionRetentionDays: "7"
  # Days after scheduling deletion before the old OCI secret is permanently removed (OCI min: 1, max: 29).
  ociSecretDeletionRetentionDays: "7"

  metricsPort: "9090"

  enableUniqueSerialNumberGeneration: false
  clusterSerialNumberPrefix: "935"
  startToCloseWorkflowTimeoutLv: "60m"
  startToCloseWorkflowTimeoutUpgrade: "300m"
  startToCloseWorkflowTimeoutUpgradeLv: "360m"
  ociParallelNumberOfNodesForItc: 4
  vsaSignedUrlDurationHours: 12

  workflowGlobalTimeoutMinutes: "60" # Global timeout for workflows in minutes
  createPoolWorkflowTimeoutMinutes: "150" # Create pool workflow run timeout (standard pools) in minutes
  createPoolWorkflowTimeoutMinutesLV: "150" # Create pool workflow run timeout (LV pools) in minutes
  updatePoolWorkflowTimeoutMinutes: "150" # Update pool workflow run timeout (standard pools) in minutes
  updatePoolWorkflowTimeoutMinutesLV: "150" # Update pool workflow run timeout (LV pools) in minutes
  # Default cancellation timeouts
  workflowCancellationTimeout: 5 # Default timeout (in minutes) for cancellation acknowledgment
  workflowForceCancelWaitTimeout: 30 # Default timeout (in seconds) for force termination acknowledgment
  poolWorkflowCancellationAckTimeout: 5 # Timeout (in minutes)
  poolWorkflowForceTerminationAckTimeout: 30 # Timeout (in seconds)

  # Default Workflow Retry configuration
  startToCloseTimeout: "55m"
  # Hyperscaler retry configuration
  hyperscalerHeartbeatTimeout: "300s"
  hyperscalerRetryInitialInterval: "30s"
  hyperscalerLRORetryInitialInterval: "30s"
  hyperscalerRetryMaximumAttempts: "10"
  hyperscalerRetryBackoffCoefficient: "1"
  hyperscalerRetryMaximumInterval: "30s"
  retryInterval: "5s"
  retryMaxAttempts: "3"
  retryMaxInterval: "5m"
  retryBackoffCoefficient: "2.0"
  startToCloseTimeoutForHyperscaler: "5m"

  # Pool workflow timeout configuration
  poolActivityHeartbeatTimeout: "5m"  # Pool activity heartbeat timeout
  databaseHeartbeatTimeoutSec: "10"   # Database operations heartbeat timeout in seconds
  setupNwHeartbeatTimeoutSec: "300"   # Setup network heartbeat timeout in seconds

  # NLF License configuration
  nlfLicenseSecretPath: "" # Format to be followed: <secret-name>/versions/<secret-version>

  database:
    type: "postgres"
    # OCI Database for PostgreSQL requires TLS. Use "require" (or "verify-full" with CA cert).
    sslMode: "require"
    timezone: "UTC"
    runMigrationOnStart: "true"
    host: primary.djzfvolyanswjizl6jz5bkqucnfeha.postgresql.us-ashburn-1.oci.oraclecloud.com  # Primary endpoint FQDN from OCI DB connection details
    port: 5432
    user: postgres
    adminUser: postgres
    dbname: vcp
    # Kubernetes Secret (create before install; Helm does not manage it). Required keys:
    # DB_USER, DB_PASSWORD, DB_ADMIN_USER, DB_ADMIN_PASSWORD
    existingSecretName: "vcp-db-secret"
    maxConns: 20
    maxIdleConns: 20
    maxConnLifetime: "1h"

# OKE (Oracle Kubernetes Engine) - optional settings for OCI installation
oke:
  # Optional node selector for OKE node pools (e.g. worker shape or pool label)
  nodeSelector: {}
  # Set to true if OKE cluster does not expose zone/hostname labels and topology spread causes scheduling issues
  disableTopologySpread: false

# Image pull secrets for OCIR. Create with:
# kubectl create secret docker-registry ocir-secret -n vcp --docker-server=<region>.ocir.io --docker-username='<tenancy>/<user>' --docker-password='<auth-token>'
imagePullSecrets:
  - name: ocir-secret

service:
  type: ClusterIP

