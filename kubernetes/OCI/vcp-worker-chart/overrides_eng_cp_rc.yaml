# OCI environment overrides: tenancy, compartment, region, OCIR, DB, custom images.
# Merge with defaults:
#   helm upgrade --install vcp-worker . -n <ns> -f values.yaml -f overrides_eng_cp_rc.yaml

global:
  primaryImageRegistry: iad.ocir.io
  primaryImageRegistryPath: "idqogasfjw45"

# Multi-version worker support. One Deployment + ConfigMap is rendered per entry so
# in-flight workflows keep listening on customer-workflows-<version> during upgrades.
# On env upgrade, append the new build entry and (optionally) drop the oldest.
# See doc/architecture/designs/0011-vcp-worker_versioning-design.md.
