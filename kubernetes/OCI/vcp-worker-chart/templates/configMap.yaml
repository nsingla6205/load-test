{{- include "vcp-worker.validateVersions" . -}}
{{- range .Values.app }}
  {{- $name := .name }}
  {{- $workerAdditionalConfig := .workerAdditionalConfig }}
  {{- range $ver := $.Values.versionsSupported }}
    {{- $versionName := $ver.name }}
    {{- $version := include "vcp-worker.versionSlug" $versionName }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vcp-worker.configMapName" (printf "%s-%s" $name $version) }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
  labels:
    app: {{ $name }}-{{ $version }}
data:
  {{- range $key, $value := $workerAdditionalConfig }}
  {{ include "toUpperSnakeCase" $key }}: {{ $value | quote }}
  {{- end }}
  TEMPORAL_ADDRESS: {{ $.Values.workerConfig.temporalAddress | quote }}
  HYPERSCALER: {{ $.Values.global.hyperscaler | default $.Values.global.environment | quote }}
  # 0 : username/password, 1 : username/password in OCI Vault. Certificate authentication (2) is not yet supported on OCI.
  DB_TYPE: {{ $.Values.workerConfig.database.type | quote }}
  DB_PORT: {{ $.Values.workerConfig.database.port | quote }}
  DB_NAME: {{ $.Values.workerConfig.database.dbname | quote }}
  DB_ADMIN_USER: {{ $.Values.workerConfig.database.adminUser | quote }}
  DB_SSL_MODE: {{ $.Values.workerConfig.database.sslMode | quote }}
  DB_TIMEZONE: {{ $.Values.workerConfig.database.timezone | quote }}
  DB_MAX_OPEN_CONNS: {{ $.Values.workerConfig.database.maxConns | quote }}
  DB_MAX_IDLE_CONNS: {{ $.Values.workerConfig.database.maxIdleConns | quote }}
  DB_CONN_MAX_LIFETIME: {{ $.Values.workerConfig.database.maxConnLifetime | quote }}
  DB_HOST: {{ $.Values.workerConfig.database.host | quote }}
  DB_USER: {{ $.Values.workerConfig.database.user | quote }}
  VLMWORKFLOW_RETRY_MAX_ATTEMPTS: {{ $.Values.workerConfig.vlmWorkflowRetryMaxAttempts | quote }}
  RUN_MIGRATION_ON_START: {{ $.Values.workerConfig.database.runMigrationOnStart | quote }}
  OBJECT_STORE_PROVIDER: {{ $.Values.workerConfig.objectStoreProvider | quote }}
  LOCAL_REGION: {{ $.Values.workerConfig.localRegion | quote }}
  VSA_OPERATION_TIMEOUT: {{ $.Values.workerConfig.vsaOperationTimeout | quote }}
  LOGGER_LEVEL: {{ $.Values.workerConfig.loggerLevel | quote }}
  VLM_CONFIG_FILE_PATH: {{ $.Values.workerConfig.vlmConfigFilePath | quote }}
  VMRS_CONFIG_PATH: {{ $.Values.workerConfig.vmrsConfigPath | quote }}
  CERTIFICATE_LIFETIME: {{ $.Values.workerConfig.certificateLifetime | quote }}
  CA_NAME: {{ $.Values.workerConfig.caName | quote }}
  ENABLE_VSA_CERTIFICATE_ROTATION: {{ $.Values.workerConfig.enableVsaCertificateRotation | quote }}
  ENABLE_VSA_EXPIRED_CERTIFICATES_ROTATION: {{ $.Values.workerConfig.enableVsaExpiredCertificatesRotation | quote }}
  ENABLE_OCI_VSA_CERTIFICATE_ROTATION: {{ $.Values.workerConfig.enableOciVsaCertificateRotation | default "false" | quote }}
  OCI_CERTIFICATE_ROTATION_CRON_EXPRESSION: {{ $.Values.workerConfig.ociCertificateRotationCronExpression | quote }}
  VSA_LIFECYCLE_MANAGER_QUEUE_PREFIX: {{ $.Values.workerConfig.vsaLifecycleManagerQueuePrefix | quote }}
  VSA_VLM_ENCRYPTION_KEY: {{ $.Values.workerConfig.vsaVlmEncryptionKey | quote }}
  VLM_RETRY_ERROR_PATTERNS: {{ $.Values.workerConfig.vlmRetryErrorPatterns | quote }}
  NUMBER_OF_HA_PAIRS_LARGE_CAPACITY: {{ $.Values.workerConfig.numberOfHaPairsLargeCapacity | quote }}
  VLM_CREATE_VSA_CLUSTER_DEPLOYMENT_WF_TIMEOUT_MINUTES_LV: {{ $.Values.workerConfig.vlmCreateVsaClusterDeploymentWfTimeoutMinutesLv | quote }}
  ENABLE_VLM_WORKFLOW_TIMEOUT_OVERRIDES: {{ $.Values.workerConfig.enableVlmWorkflowTimeoutOverrides | quote }}
  VLM_CREATE_VSA_CLUSTER_DEPLOYMENT_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmCreateVSAClusterDeploymentWorkflowTimeoutMinutes | quote }}
  VLM_CREATE_VSA_SVM_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmCreateVSASVMWorkflowTimeoutMinutes | quote }}
  VLM_DELETE_VSA_CLUSTER_DEPLOYMENT_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmDeleteVSAClusterDeploymentWorkflowTimeoutMinutes | quote }}
  VLM_UPDATE_VSA_CLUSTER_DEPLOYMENT_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmUpdateVSAClusterDeploymentWorkflowTimeoutMinutes | quote }}
  VLM_CLUSTER_POWER_OP_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmClusterPowerOpWorkflowTimeoutMinutes | quote }}
  VLM_UPDATE_VSA_MEDIATOR_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmUpdateVsaMediatorWFTimeoutMinutes | quote }}
  VLM_DEFAULT_WORKFLOW_EXECUTION_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmDefaultWorkflowExecutionTimeoutMinutes | quote }}
  VLM_MODIFY_VSA_SVM_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmModifyVsaSvmTimeoutMinutes | quote }}
  VLM_DELETE_VSA_SVM_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmDeleteVsaSvmTimeoutMinutes | quote }}
  VLM_UPGRADE_VSA_CLUSTER_DEPLOYMENT_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmUpgradeVsaClusterDeploymentTimeoutMinutes | quote }}
  VLM_UPDATE_LICENSE_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmUpdateLicenseTimeoutMinutes | quote }}
  VLM_CREATE_VSA_EXPERT_MODE_USER_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmCreateVsaExpertModeUserTimeoutMinutes | quote }}
  VLM_ROTATE_FABRIC_POOL_KEYS_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmRotateFabricPoolKeysTimeoutMinutes | quote }}
  VLM_MAINTENANCE_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmMaintenanceTimeoutMinutes | quote }}
  VLM_MEDIATOR_MAINTENANCE_REBOOT_MIGRATE_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmMediatorMaintenanceRebootMigrateTimeoutMinutes | quote }}
  VLM_MEDIATOR_MAINTENANCE_RECREATE_WF_TIMEOUT_MINUTES: {{ $.Values.workerConfig.vlmMediatorMaintenanceRecreateTimeoutMinutes | quote }}
  SKIP_ONTAP_IMAGE_VERSION_MATCH: {{ $.Values.workerConfig.skipOntapImageVersionMatch | quote }}
  VSA_MEDIATOR_IMAGE_NAME: {{ $.Values.workerConfig.vsaMediatorImageName | quote }}
  VSA_IMAGE_NAME: {{ $.Values.workerConfig.vsaImageName | quote }}
  METRICS_PORT: {{ $.Values.workerConfig.metricsPort | quote }}
  ENABLE_UNIQUE_SERIAL_NUMBER_GENERATION: {{ $.Values.workerConfig.enableUniqueSerialNumberGeneration | quote }}
  CLUSTER_SERIAL_NUMBER_PREFIX: {{ $.Values.workerConfig.clusterSerialNumberPrefix | quote }}
  REGION_NUMBER_MAP: {{ $.Values.regionNumberMap | toJson | quote }}
  START_TO_CLOSE_WORKFLOW_TIMEOUT_LV: {{ $.Values.workerConfig.startToCloseWorkflowTimeoutLv | quote }}
  START_TO_CLOSE_WORKFLOW_TIMEOUT_UPGRADE: {{ $.Values.workerConfig.startToCloseWorkflowTimeoutUpgrade | quote }}
  START_TO_CLOSE_WORKFLOW_TIMEOUT_UPGRADE_LV: {{ $.Values.workerConfig.startToCloseWorkflowTimeoutUpgradeLv | quote }}
  OCI_PARALLEL_NUMBER_OF_NODES_FOR_ITC: {{ $.Values.workerConfig.ociParallelNumberOfNodesForItc | quote }}
  VSA_SIGNED_URL_DURATION_HOURS: {{ $.Values.workerConfig.vsaSignedUrlDurationHours | quote }}
  WORKFLOW_GLOBAL_TIMEOUT_MINUTES: {{ $.Values.workerConfig.workflowGlobalTimeoutMinutes | quote }}
  CREATE_POOL_WORKFLOW_TIMEOUT_MINUTES: {{ $.Values.workerConfig.createPoolWorkflowTimeoutMinutes | quote }}
  CREATE_POOL_WORKFLOW_TIMEOUT_MINUTES_LV: {{ $.Values.workerConfig.createPoolWorkflowTimeoutMinutesLV | quote }}
  UPDATE_POOL_WORKFLOW_TIMEOUT_MINUTES: {{ $.Values.workerConfig.updatePoolWorkflowTimeoutMinutes | quote }}
  UPDATE_POOL_WORKFLOW_TIMEOUT_MINUTES_LV: {{ $.Values.workerConfig.updatePoolWorkflowTimeoutMinutesLV | quote }}
  POOL_MAINTENANCE_WORKFLOW_TIMEOUT_MINUTES: {{ $.Values.workerConfig.poolMaintenanceWorkflowTimeoutMinutes | quote }}
  DELETE_POOL_WORKFLOW_TIMEOUT_MINUTES: {{ $.Values.workerConfig.deletePoolWorkflowTimeoutMinutes | quote }}
  ROTATE_FABRIC_POOL_KEYS_WORKFLOW_TIMEOUT_MINUTES: {{ $.Values.workerConfig.rotateFabricPoolKeysWorkflowTimeoutMinutes | quote }}
  RESET_OCI_ADMIN_PASSWORD_WORKFLOW_TIMEOUT_MINUTES: {{ $.Values.workerConfig.resetOciAdminPasswordWorkflowTimeoutMinutes | quote }}
  CREATE_SVM_WORKFLOW_TIMEOUT_MINUTES: {{ $.Values.workerConfig.createSVMWorkflowTimeoutMinutes | quote }}
  DELETE_SVM_WORKFLOW_TIMEOUT_MINUTES: {{ $.Values.workerConfig.deleteSVMWorkflowTimeoutMinutes | quote }}
  UPDATE_SVM_WORKFLOW_TIMEOUT_MINUTES: {{ $.Values.workerConfig.updateSVMWorkflowTimeoutMinutes | quote }}
  CLUSTER_UPGRADE_WORKFLOW_TIMEOUT_MINUTES: {{ $.Values.workerConfig.clusterUpgradeWorkflowTimeoutMinutes | quote }}
  CLUSTER_UPGRADE_WORKFLOW_TIMEOUT_MINUTES_LV: {{ $.Values.workerConfig.clusterUpgradeWorkflowTimeoutMinutesLV | quote }}
  REFRESH_RBAC_WORKFLOW_TIMEOUT_MINUTES: {{ $.Values.workerConfig.refreshRbacWorkflowTimeoutMinutes | quote }}
  WORKFLOW_CANCELLATION_TIMEOUT: {{ $.Values.workerConfig.workflowCancellationTimeout | quote }}
  WORKFLOW_FORCE_CANCEL_WAIT_TIMEOUT: {{ $.Values.workerConfig.workflowForceCancelWaitTimeout | quote }}
  POOL_WORKFLOW_CANCELLATION_TIMEOUT: {{ $.Values.workerConfig.poolWorkflowCancellationAckTimeout | quote }}
  POOL_WORKFLOW_FORCE_CANCEL_WAIT_TIMEOUT: {{ $.Values.workerConfig.poolWorkflowForceTerminationAckTimeout | quote }}
  START_TO_CLOSE_WORKFLOW_TIMEOUT: {{ $.Values.workerConfig.startToCloseTimeout | quote }}
  HYPERSCALER_HEARTBEAT_TIMEOUT: {{ $.Values.workerConfig.hyperscalerHeartbeatTimeout | quote }}
  HYPERSCALER_RETRY_INITIAL_INTERVAL: {{ $.Values.workerConfig.hyperscalerRetryInitialInterval | quote }}
  HYPERSCALER_LRO_RETRY_INITIAL_INTERVAL: {{ $.Values.workerConfig.hyperscalerLRORetryInitialInterval | quote }}
  HYPERSCALER_RETRY_MAXIMUM_ATTEMPTS: {{ $.Values.workerConfig.hyperscalerRetryMaximumAttempts | quote }}
  HYPERSCALER_RETRY_BACKOFF_COEFFICIENT: {{ $.Values.workerConfig.hyperscalerRetryBackoffCoefficient | quote }}
  HYPERSCALER_RETRY_MAXIMUM_INTERVAL: {{ $.Values.workerConfig.hyperscalerRetryMaximumInterval | quote }}
  RETRY_INTERVAL: {{ $.Values.workerConfig.retryInterval | quote }}
  RETRY_MAX_ATTEMPTS: {{ $.Values.workerConfig.retryMaxAttempts | quote }}
  RETRY_MAX_INTERVAL: {{ $.Values.workerConfig.retryMaxInterval | quote }}
  RETRY_BACKOFF_COEFFICIENT: {{ $.Values.workerConfig.retryBackoffCoefficient | quote }}
  START_TO_CLOSE_TIMEOUT_FOR_HYPERSCALER: {{ $.Values.workerConfig.startToCloseTimeoutForHyperscaler | quote }}
  POOL_ACTIVITY_HEARTBEAT_TIMEOUT: {{ $.Values.workerConfig.poolActivityHeartbeatTimeout | quote }}
  DATABASE_HEARTBEAT_TIMEOUT_SEC: {{ $.Values.workerConfig.databaseHeartbeatTimeoutSec | quote }}
  SETUP_NW_HEARTBEAT_TIMEOUT_SEC: {{ $.Values.workerConfig.setupNwHeartbeatTimeoutSec | quote }}
  NLF_LICENSE_SECRET_PATH: {{ $.Values.workerConfig.nlfLicenseSecretPath | quote }}
  TASK_QUEUE_VERSION: "{{ $version }}"
  ONTAP_VERSION_DETAILS: {{ $.Values.workerConfig.ontapVersionDetails | quote }}
  OCI_VSA_INSTANCE_TYPE: {{ $.Values.workerConfig.vsaMediatorInstanceType | quote }}
  OCI_CREATOR: {{ $.Values.workerConfig.ociCreator | quote }}
  OCI_VSA_FLEX_OCPUS: {{ $.Values.workerConfig.ociVsaFlexOcpus | quote }}
  OCI_VSA_FLEX_MEMORY_IN_GBS: {{ $.Values.workerConfig.ociVsaFlexMemoryInGBs | quote }}
  OCI_VSA_USER_BOOTARGS: {{ $.Values.workerConfig.ociVsaUserBootargs | quote }}
  OCI_VSA_SHARED_HA_DATA_DISK_COUNT: {{ $.Values.workerConfig.ociVsaSharedHaDataDiskCount | quote }}
  OCI_VSA_NON_SHARED_HA_DATA_DISK_COUNT: {{ $.Values.workerConfig.ociVsaNonSharedHaDataDiskCount | quote }}
  OCI_VMRS_ENABLED: {{ $.Values.workerConfig.ociVmrsEnabled | default "false" | quote }}
  OCI_MEDIATOR_INSTANCE_TYPE: {{ $.Values.workerConfig.ociMediatorInstanceType | quote }}
  SECRET_URI: {{ $.Values.workerConfig.secretUri | quote }}
  SMC_LICENSE_SECRET_URI: {{ $.Values.workerConfig.smcLicenseSecretUri | quote }}
  OCI_RESOURCE_PRINCIPAL_REGION: {{ $.Values.workerConfig.ociResourcePrincipalRegion | quote }}
  OCI_RESOURCE_PRINCIPAL_VERSION: {{ $.Values.workerConfig.ociResourcePrincipalVersion | quote }}
  OCI_EXPERT_MODE_PASSWORD: {{ $.Values.workerConfig.ociExpertModePassword | quote }}
  ENABLE_ADMIN_TEMP_PASSWORD: {{ $.Values.workerConfig.enableAdminTempPassword | default "false" | quote }}
  ENABLE_OCI_TEMP_PASSWORD_RESET_CRON: {{ $.Values.workerConfig.enableOciTempPasswordResetCron | default "false" | quote }}
  OCI_TEMP_PASSWORD_RESET_AFTER_MINUTES: {{ $.Values.workerConfig.ociTempPasswordResetAfterMinutes | default 1440 | quote }}
  OCI_TEMP_PASSWORD_RESET_POOL_STATES: {{ $.Values.workerConfig.ociTempPasswordResetPoolStates | default "READY,DEGRADED" | quote }}
  OCI_EXPERT_MODE_RBAC_FILE_URL: {{ $.Values.workerConfig.ociExpertModeRbacFileUrl | quote }}
  OCI_EXPERT_MODE_RBAC_FILE_CHECKSUM: {{ $.Values.workerConfig.ociExpertModeRbacFileChecksum | quote }}
  OCI_EXPERT_MODE_USERNAME: {{ $.Values.workerConfig.ociExpertModeUsername | quote }}
  OCI_VAULT_OCID: {{ $.Values.workerConfig.ociVaultOcid | quote }}
  OCI_MASTER_KEY_OCID: {{ $.Values.workerConfig.ociMasterKeyOcid | quote }}
  OCI_VAULT_COMPARTMENT_OCID: {{ $.Values.workerConfig.ociVaultCompartmentOcid | quote }}
  OCI_CERT_COMPARTMENT_OCID: {{ $.Values.workerConfig.ociCertCompartmentOcid | quote }}
  LOCAL_CELL: {{ $.Values.workerConfig.localCell | quote }}
  OCI_VSA_SERIAL_NUMBER_ALLOCATION_ENABLED: {{ $.Values.workerConfig.ociVSASerialAllocationEnabled | quote }}
  OCI_VSA_USE_SECONDARY_IPS_FOR_LIFS: {{ $.Values.workerConfig.ociVsaUseSecondaryIpsForLifs | default true | quote }}
  OCI_VSA_EXT_IP_FOR_NODE_MGMT: {{ $.Values.workerConfig.ociVsaExtIpForNodeMgmt | default false | quote }}
  DISABLE_VSA_CLEANUP_ON_VLM_FAILURE: {{ $.Values.workerConfig.disableVsaCleanupOnVlmFailure | default false | quote }}
  OCI_ISSUER_CA_OCID: {{ $.Values.workerConfig.ociIssuerCaOcid | quote }}
  OCI_CLIENT_ISSUER_CA_OCID: {{ $.Values.workerConfig.ociClientIssuerCaOcid | quote }}
  OCI_SEPARATE_MTLS_CLIENT_CERT: {{ $.Values.workerConfig.ociSeparateMtlsClientCert | default "false" | quote }}
  OCI_SERVICE_ISSUER_CA_OCID: {{ $.Values.workerConfig.ociServiceIssuerCaOcid | quote }}
  OCI_ENABLE_SERVICE_ONTAP_CERT: {{ $.Values.workerConfig.ociServiceOntapCertEnabled | default "false" | quote }}
  VSA_DEPLOYED_DNS_NAME: {{ $.Values.workerConfig.vsaDeployedDnsName | quote }}
  OCI_VSA_DNS_ZONE_OCID: {{ $.Values.workerConfig.ociVsaDnsZoneOcid | quote }}
  OCI_USE_TLS_SNI_OVERRIDE: {{ $.Values.workerConfig.ociUseTlsSniOverride | quote }}
  OCI_PROXY_BASE_URL: {{ $.Values.workerConfig.ociProxyBaseUrl | default "http://resource-manager-service.fsn.svc.cluster.local" | quote }}
  OCI_PROXY_ALLOW_HTTP: {{ $.Values.workerConfig.ociProxyAllowHttp | default true | quote }}
  OCI_PROXY_CA_BUNDLE: {{ $.Values.workerConfig.ociProxyCaBundle | default "" | quote }}
  OCI_PROXY_CLIENT_CERT: {{ $.Values.workerConfig.ociProxyClientCert | default "" | quote }}
  OCI_PROXY_CLIENT_KEY: {{ $.Values.workerConfig.ociProxyClientKey | default "" | quote }}
  OCI_PROXY_VALIDATE_ONLY: {{ $.Values.workerConfig.ociProxyValidateOnly | default false | quote }}
  OCI_PROXY_HTTP_TIMEOUT_SEC: {{ $.Values.workerConfig.ociProxyHttpTimeoutSec | default 60 | quote }}
  OCI_PROXY_API_VERSION_PREFIX: {{ $.Values.workerConfig.ociProxyAPIVersionPrefix | default "" | quote }}
  OCI_PROXY_SECRET_BUNDLES_API_VERSION_PREFIX: {{ $.Values.workerConfig.ociProxySecretBundlesAPIVersionPrefix | default "" | quote }}
  OCI_PROXY_VAULT_API_VERSION_PREFIX: {{ $.Values.workerConfig.ociProxyVaultAPIVersionPrefix | default "" | quote }}
  OCI_PROXY_CERTIFICATES_API_VERSION_PREFIX: {{ $.Values.workerConfig.ociProxyCertificatesAPIVersionPrefix | default "" | quote }}
  OCI_PROXY_DNS_API_VERSION_PREFIX: {{ $.Values.workerConfig.ociProxyDNSAPIVersionPrefix | default "" | quote }}
  OCI_VSA_MIN_PER_DISK_SIZE_GI: {{ $.Values.workerConfig.ociVsaMinPerDiskSizeGi | default 50 | quote }}
  OCI_VSA_ALLOW_NON_DENSE_SHAPE_FOR_VSA: {{ $.Values.workerConfig.ociVsaAllowNonDenseShapeForVsa | default true | quote }}
  OCI_DEFINED_TAG_NAMESPACE: {{ $.Values.workerConfig.ociDefinedTagNamespace | default "netapp_tags" | quote }}
  OCI_ENABLE_ITC_RECOVERY: {{ $.Values.workerConfig.ociEnableItcRecovery | default "false" | quote }}
  OCI_VLM_ITC_RECOVERY_CAPACITY_ERROR_MESSAGE: {{ $.Values.workerConfig.ociVlmItcRecoveryCapacityErrorMessage | quote }}
  OCI_CERTIFICATE_VALIDITY_DAYS: {{ $.Values.workerConfig.ociCertificateValidityDays | default "1000" | quote }}
  OCI_CERTIFICATE_ROTATION_THRESHOLD_PERCENTAGE: {{ $.Values.workerConfig.ociCertificateRotationThresholdPercentage | default "75" | quote }}
  OCI_CERTIFICATE_ROTATION_POOL_STATES: {{ $.Values.workerConfig.ociCertificateRotationPoolStates | default "READY,DEGRADED" | quote }}
  OCI_CERTIFICATE_ROTATION_BATCH_SIZE: {{ $.Values.workerConfig.ociCertificateRotationBatchSize | default "10" | quote }}
  OCI_CERTIFICATE_ROTATION_CHILD_WORKFLOW_TIMEOUT_MINUTES: {{ $.Values.workerConfig.ociCertificateRotationChildWorkflowTimeoutMinutes | default "15" | quote }}
  OCI_CERTIFICATE_DELETION_RETENTION_DAYS: {{ $.Values.workerConfig.ociCertificateDeletionRetentionDays | default "7" | quote }}
  OCI_SECRET_DELETION_RETENTION_DAYS: {{ $.Values.workerConfig.ociSecretDeletionRetentionDays | default "7" | quote }}
  # Customer worker concurrency caps and rate limits.
  # OCI deploys only the customer worker (WORKER_TASK_QUEUE=customer-workflows); the
  # background worker is not deployed on OCI, so BACKGROUND_WORKER_* vars are omitted.
  CUSTOMER_WORKER_MAX_CONCURRENT_ACTIVITY_EXECUTION: {{ $.Values.workerConfig.customerWorkerMaxConcurrentActivityExecution | quote }}
  CUSTOMER_WORKER_MAX_CONCURRENT_WORKFLOW_TASK_EXECUTION: {{ $.Values.workerConfig.customerWorkerMaxConcurrentWorkflowTaskExecution | quote }}
  CUSTOMER_WORKER_MAX_CONCURRENT_LOCAL_ACTIVITY_EXECUTION: {{ $.Values.workerConfig.customerWorkerMaxConcurrentLocalActivityExecution | quote }}
  CUSTOMER_WORKER_ACTIVITIES_PER_SECOND: {{ $.Values.workerConfig.customerWorkerActivitiesPerSecond | quote }}
  CUSTOMER_WORKER_TASK_QUEUE_ACTIVITIES_PER_SECOND: {{ $.Values.workerConfig.customerWorkerTaskQueueActivitiesPerSecond | quote }}
  BACKGROUND_WORKER_MAX_CONCURRENT_ACTIVITY_EXECUTION: {{ $.Values.workerConfig.backgroundWorkerMaxConcurrentActivityExecution | quote }}
  BACKGROUND_WORKER_MAX_CONCURRENT_WORKFLOW_TASK_EXECUTION: {{ $.Values.workerConfig.backgroundWorkerMaxConcurrentWorkflowTaskExecution | quote }}
  BACKGROUND_WORKER_MAX_CONCURRENT_LOCAL_ACTIVITY_EXECUTION: {{ $.Values.workerConfig.backgroundWorkerMaxConcurrentLocalActivityExecution | quote }}
  BACKGROUND_WORKER_ACTIVITIES_PER_SECOND: {{ $.Values.workerConfig.backgroundWorkerActivitiesPerSecond | quote }}
  BACKGROUND_WORKER_TASK_QUEUE_ACTIVITIES_PER_SECOND: {{ $.Values.workerConfig.backgroundWorkerTaskQueueActivitiesPerSecond | quote }}
---
  {{- end }}
{{- end }}
