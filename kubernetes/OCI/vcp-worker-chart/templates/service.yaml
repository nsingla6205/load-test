{{- include "vcp-worker.validateVersions" . -}}
{{- range .Values.app }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-service
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ .name }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - name: metrics
      port: {{ $.Values.workerConfig.metricsPort }}
      targetPort: {{ $.Values.workerConfig.metricsPort }}
  selector:
    {{- /* Metrics Service targets only the latest supported version's pods.
           versionsSupported[] is guaranteed non-empty by vcp-worker.validateVersions. */ -}}
    {{- $lastVer := (last $.Values.versionsSupported) }}
    app: {{ .name }}-{{ include "vcp-worker.versionSlug" $lastVer.name }}
---
{{- end }}
