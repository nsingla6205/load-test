environment: oci

podAffinity:
  enabled: true

enabled: true
serviceAccountName: oci-proxy
replicaCount: 1

localRegion: "us-ashburn-1"
runMigrationOnStart: true
temporalAddress: "temporal-frontend.temporal.svc.cluster.local:7233"
loggerLevel: "info"

# OCI object store
objectStoreProvider: "oci"

createPoolWorkflowTimeoutMinutes: "150"
createPoolWorkflowTimeoutMinutesLV: "150"
updatePoolWorkflowTimeoutMinutes: "150"
waitForTemporalEnabled: false
hyperScaler: "oci"
vsaAuthType: 2  # 0 : username/password, 1: password-based auth, 2: certificate authentication

# OCI certificate rotation schedule (created idempotently at oci-proxy startup on the customer task queue).
# enableOciVsaCertificateRotation: "true" creates the Temporal Schedule; "false" deletes it if present.
enableOciVsaCertificateRotation: "false"
# Cron cadence for the rotation schedule. Default is daily at midnight UTC.
ociCertificateRotationCronExpression: "0 0 * * *"

# Gates the reset-password (admin temporary password) API. Must match the
# vcp-worker-chart's enableAdminTempPassword so the proxy and worker agree.
enableAdminTempPassword: true

# Expiry window (in hours) reported for the temporary ociadmin password returned
# by the reset-password API. The response's passwordExpiresAt is computed as the
# response time (UTC) plus this many hours. Default 24.
ociAdminTempPasswordExpiryHours: 24

enableOciTempPasswordResetCron: "false"
ociTempPasswordVerificationCronExpression: "0 0 * * *"

# Global for image registry (standalone chart)
global:
  primaryImageRegistry: iad.ocir.io
  primaryImageRegistryPath: "idqogasfjw45"
  primaryImageRegistryPasswordAuth: true
  primaryImagePullSecretName: ocir-secret
  secondaryImageRegistry: "iad.ocir.io"
  secondaryImageRegistryPath: "nmobsa"
  secondaryImageRegistryPasswordAuth: false
  useSecondaryImageRegistry: false
  useTags: true
  chartPrimaryImageRegistry: ""
  chartSecondaryImageRegistry: ""

images:
  ociProxy:
    name: oci-proxy
    tag: "02042026"
    digest: ""
    secondary: false
    pullPolicy: IfNotPresent

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 150Mi

service:
  type: ClusterIP
  appPort: 8080

istio:
  enabled: false

startupProbe:
  path: /healthz/ready
  port: 15021
  scheme: HTTP
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 1
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 10
  timeoutSeconds: 1
  failureThreshold: 1
  periodSeconds: 5

# Database: same connection details as vcp-worker-chart (shared OCI Postgres).
database:
  host: primary.djzfvolyanswjizl6jz5bkqucnfeha.postgresql.us-ashburn-1.oci.oraclecloud.com
  port: 5432
  user: postgres
  password: ""
  name: vcp
  adminUser: postgres
  adminPassword: ""
  sslMode: "require"
  useExistingSecret: true
  existingSecretName: "vcp-db-secret"

serviceAccountAnnotations: {}

temporal:
  timeouts:
    heartbeat:
      setupNwSecond: 300

secretManagerEnabled: false
externalSecrets: {}

ociDeploymentNamePrefix: "ocsn-"
ociThroughputThresholdGbps: 5
ociNodeCapacityMaxTib: 425

# OKE-specific
oke:
  nodeSelector: {}
  disableTopologySpread: false

imagePullSecrets:
  - name: ocir-secret

# Optional Ingress for OKE (e.g. OCI LB or nginx). Disabled by default.
ingress:
  enabled: false
  className: ""   # e.g. "nginx" or OCI LB class
  host: ""
  annotations: {}
  tls: []

# OCI region number map (MUST stay identical to vcp-worker-chart/values.yaml;
# divergence causes inconsistent node serial-number derivation between proxy and worker).
regionNumberMap:
  us-ashburn-1: "01"
  us-phoenix-1: "02"
