apiVersion: v1
kind: ConfigMap
metadata:
  name: oci-proxy-service-env-config
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    {{- include "oci_proxy.kubernetes.annotations" . | nindent 4 }}
    {{- include "oci_proxy.helmchart.annotations" . | nindent 4 }}
  labels:
    {{- include "oci_proxy.kubernetes.labels" . | nindent 4 }}
    {{- include "oci_proxy.helmchart.labels" . | nindent 4 }}
    app: oci-proxy-service
data:
  DB_HOST: "{{ index .Values "database" "host" }}"
  DB_NAME: "{{ index .Values "database" "name" }}"
  DB_SSL_MODE: "{{ index .Values "database" "sslMode" }}"
  LOCAL_REGION: "{{ index .Values "localRegion" }}"
  RUN_MIGRATION_ON_START: "{{ index .Values "runMigrationOnStart" }}"
  TEMPORAL_ADDRESS: "{{ index .Values "temporalAddress" }}"
  OBJECT_STORE_PROVIDER: "{{ index .Values "objectStoreProvider" }}"
  LOGGER_LEVEL: "{{ index .Values "loggerLevel" }}"
  CREATE_POOL_WORKFLOW_TIMEOUT_MINUTES: "{{ index .Values "createPoolWorkflowTimeoutMinutes" }}"
  CREATE_POOL_WORKFLOW_TIMEOUT_MINUTES_LV: "{{ index .Values "createPoolWorkflowTimeoutMinutesLV" }}"
  UPDATE_POOL_WORKFLOW_TIMEOUT_MINUTES: "{{ index .Values "updatePoolWorkflowTimeoutMinutes" }}"
  UPDATE_POOL_WORKFLOW_TIMEOUT_MINUTES_LV: "{{ index .Values "updatePoolWorkflowTimeoutMinutesLV" }}"
  DELETE_POOL_WORKFLOW_TIMEOUT_MINUTES: "{{ index .Values "deletePoolWorkflowTimeoutMinutes" }}"
  CREATE_SVM_WORKFLOW_TIMEOUT_MINUTES: "{{ index .Values "createSVMWorkflowTimeoutMinutes" }}"
  DELETE_SVM_WORKFLOW_TIMEOUT_MINUTES: "{{ index .Values "deleteSVMWorkflowTimeoutMinutes" }}"
  UPDATE_SVM_WORKFLOW_TIMEOUT_MINUTES: "{{ index .Values "updateSVMWorkflowTimeoutMinutes" }}"
  ROTATE_FABRIC_POOL_KEYS_WORKFLOW_TIMEOUT_MINUTES: "{{ index .Values "rotateFabricPoolKeysWorkflowTimeoutMinutes" }}"
  RESET_OCI_ADMIN_PASSWORD_WORKFLOW_TIMEOUT_MINUTES: "{{ index .Values "resetOciAdminPasswordWorkflowTimeoutMinutes" }}"
  CLUSTER_UPGRADE_WORKFLOW_TIMEOUT_MINUTES: "{{ index .Values "clusterUpgradeWorkflowTimeoutMinutes" }}"
  CLUSTER_UPGRADE_WORKFLOW_TIMEOUT_MINUTES_LV: "{{ index .Values "clusterUpgradeWorkflowTimeoutMinutesLV" }}"
  REFRESH_RBAC_WORKFLOW_TIMEOUT_MINUTES: "{{ index .Values "refreshRbacWorkflowTimeoutMinutes" }}"
  POOL_MAINTENANCE_WORKFLOW_TIMEOUT_MINUTES: "{{ index .Values "poolMaintenanceWorkflowTimeoutMinutes" }}"
  OCI_DEPLOYMENT_NAME_PREFIX: "{{ index .Values "ociDeploymentNamePrefix" }}"
  OCI_THROUGHPUT_THRESHOLD_GBPS: "{{ index .Values "ociThroughputThresholdGbps" }}"
  OCI_NODE_CAPACITY_MAX_TIB: "{{ index .Values "ociNodeCapacityMaxTib" }}"
  REGION_NUMBER_MAP: {{ .Values.regionNumberMap | toJson | quote }}
  WAIT_FOR_TEMPORAL_ENABLED: "{{ index .Values "waitForTemporalEnabled" }}"
  TASK_QUEUE_VERSION: "{{ index .Chart.Version | lower | replace "." "-" }}"
  SETUP_NW_HEARTBEAT_TIMEOUT_SEC: {{ index .Values "temporal" "timeouts" "heartbeat" "setupNwSecond" | quote }}
  READINESS_PROBE_FAILURE_THRESHOLD: "{{ index .Values "readinessProbe" "failureThreshold" }}"
  READINESS_PROBE_PERIOD_SECONDS: "{{ index .Values "readinessProbe" "periodSeconds" }}"
  HYPERSCALER: "{{ index .Values "hyperScaler" }}"
  VSA_AUTH_TYPE: "{{ index .Values "vsaAuthType" }}" #0 for username/password, 1 for username/password in vault and 2 for certificate authentication
  # OCI certificate rotation: ENABLE gates schedule creation (and the worker's workflow self-gate);
  # CRON_EXPRESSION is the daily cadence for the Temporal Schedule created at oci-proxy startup.
  ENABLE_OCI_VSA_CERTIFICATE_ROTATION: "{{ index .Values "enableOciVsaCertificateRotation" }}"
  OCI_CERTIFICATE_ROTATION_CRON_EXPRESSION: "{{ index .Values "ociCertificateRotationCronExpression" }}"
  # Gates the reset-password (admin temporary password) API; keep in sync with the vcp-worker chart.
  ENABLE_ADMIN_TEMP_PASSWORD: "{{ index .Values "enableAdminTempPassword" }}"
  OCI_SVM_NAME_PREFIX: "{{ index .Values "ociSvmNamePrefix" }}"
  OCI_SVM_NAME_MAX_INPUT_LENGTH: "{{ index .Values "ociSvmNameMaxInputLength" }}"
  # Expiry window (hours) reported as passwordExpiresAt by the reset-password API.
  OCI_ADMIN_TEMP_PASSWORD_EXPIRY_HOURS: "{{ index .Values "ociAdminTempPasswordExpiryHours" }}"
  ENABLE_OCI_TEMP_PASSWORD_RESET_CRON: "{{ index .Values "enableOciTempPasswordResetCron" }}"
  OCI_TEMP_PASSWORD_VERIFICATION_CRON_EXPRESSION: "{{ index .Values "ociTempPasswordVerificationCronExpression" }}"
  config.yaml: |
    DB_HOST: {{ index .Values "database" "host" }}
    DB_NAME: {{ index .Values "database" "name"  }}
    SETUP_NW_HEARTBEAT_TIMEOUT_SEC: {{ index .Values "temporal" "timeouts" "heartbeat" "setupNwSecond"}}
