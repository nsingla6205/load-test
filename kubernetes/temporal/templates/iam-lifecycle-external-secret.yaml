{{/*
ExternalSecret that syncs DB admin credentials from GCP Secret Manager into a
Kubernetes secret named `iam-lifecycle-admin-secret`. Mirrors the VCP IAM
lifecycle pattern: the chart owns the secret lifecycle, and the IAM job
deletes it after success via the cleanup logic + RBAC in this directory.

Rendered when BOTH of:
  * enableIamLifecycle=true       (IAM lifecycle is in scope)
  * secretManagerEnabled=true     (operator wants chart-managed external secret)

The ExternalSecret must render regardless of cloudSqlIamAuthEnabled because
the rollback path (cloudSqlIamAuthEnabled=false) also needs admin credentials
to transfer DB ownership back to postgres.

When secretManagerEnabled=false, the IAM job falls back to
iamLifecycle.dbAdmin.existingSecret (operator-provisioned) or plain values.
*/}}
{{- if and .Values.enableIamLifecycle .Values.secretManagerEnabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: iam-lifecycle-admin-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: temporal-iam-lifecycle
    {{- include "temporal.resourceLabels" (list $ "database" "") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- include "temporal.resourceAnnotations" (list $ "" "annotations") | nindent 4 }}
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: main-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: iam-lifecycle-admin-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: DB_ADMIN_USER
      remoteRef:
        key: {{ required "externalSecrets.iamLifecycle.dbAdminUsername must be set when secretManagerEnabled=true" .Values.externalSecrets.iamLifecycle.dbAdminUsername | quote }}
    - secretKey: DB_ADMIN_PASSWORD
      remoteRef:
        key: {{ required "externalSecrets.iamLifecycle.dbAdminPassword must be set when secretManagerEnabled=true" .Values.externalSecrets.iamLifecycle.dbAdminPassword | quote }}
{{- end }}
